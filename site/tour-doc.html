:root{--bg:#d9dde3;--paper:#fff;--ink:#17202a;--muted:#5b6672;--line:#d8dde3;--soft:#f4f6f8;--dev:#1d5c8f;--devs:#e3edf6;--rec:#2c6e49;--recs:#e2f0e7;--rev:#9a5b00;--revs:#fbf0dd;--bad:#b42318;--bads:#fbe9e7;--hl:#f0b429;
--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,"Pretendard",monospace}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:14px/1.5 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
#slide{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;display:grid;grid-template-columns:340px 1fr;background:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.15)}
/* 왼쪽 설명 */
.cap{background:#17202a;color:#e8edf2;padding:22px 24px 16px;display:flex;flex-direction:column;min-height:0}
.brand{font-size:12px;color:#9fb0c0;display:flex;gap:8px;align-items:center}.brand b{color:#fff;font-size:13px}
.demo{border:1px solid #3a4754;padding:0 6px;border-radius:3px;font-size:11px}
.part{margin-top:18px;font-size:12.5px;color:#7fd1a1;font-weight:600}
.cap h1{font-size:23px;line-height:1.3;margin:6px 0 12px;color:#fff}
.cap .desc{color:#cfd8e1;font-size:14.5px;margin:0 0 14px}
.cap .say{border-left:3px solid #4fb27a;padding:2px 0 2px 12px;color:#e8edf2;font-size:14px}
.cap .say small{display:block;color:#7fd1a1;font-size:11.5px;margin-bottom:2px}
.chg{margin-top:16px;border-top:1px solid #2c3845;padding-top:12px}.chg small{color:#9fb0c0;font-size:11.5px}
.chg div{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:6px;color:#e8edf2}
.chg i{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:2px;white-space:nowrap}
.k-repo{background:#2c6e49;color:#fff}.k-gh{background:#3b4a5a;color:#fff}.k-site{background:#6b4fa0;color:#fff}.k-tag{background:#9a5b00;color:#fff}
.nav{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:10px}
.nav button{border:1px solid #3a4754;color:#e8edf2;padding:4px 12px;font-size:13px}.nav button:hover{background:#243140}
.cnt{font-size:12.5px;color:#9fb0c0;margin-left:auto}
.dots{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap}.dots button{width:13px;height:5px;background:#3a4754;padding:0;border:0}.dots button.on{background:#4fb27a}.dots button.p{margin-left:6px}
/* 오른쪽 */
.main{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--soft)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.stages{display:flex;gap:4px;flex:1}.stages span{flex:1;border:1px solid var(--line);padding:5px 8px;font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}
.stages span.on{border-color:var(--rec);background:var(--recs);color:var(--rec);font-weight:700}.stages span.new{border-style:dashed}
.where{font-size:12px;color:var(--muted);white-space:nowrap}
.work{display:grid;grid-template-columns:430px 260px 1fr;gap:12px;padding:12px;min-height:0}
.pane{background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--paper)}
.ph .sub{color:var(--muted);font-weight:400;font-family:var(--mono);font-size:11.5px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Claude 창 */
.claude{background:#faf9f5}.claude .ph{background:#faf9f5}
.logo{width:16px;height:16px;border-radius:4px;background:#d97757;display:inline-block}
.msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mu{align-self:flex-end;background:#f0eee6;border-radius:12px;padding:8px 12px;max-width:88%;font-size:13.5px;white-space:pre-line}
.mu .att{display:flex;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid #ddd8cc;background:#fff;border-radius:6px;padding:2px 8px;font-size:12px}.chip.att::before{content:"";width:8px;height:10px;border:1.5px solid #8a8475;border-radius:1.5px;flex:none}
.ma{font-size:13.5px;color:#1f1e1c;max-width:96%;white-space:pre-line}
.tool{display:flex;gap:8px;align-items:center;font-size:12.5px;border:1px solid #e6e2d8;background:#fff;border-radius:8px;padding:5px 10px;max-width:96%}
.tool b{font-weight:600;min-width:40px}.tool .p{font-family:var(--mono);font-size:11.5px;color:#3d3a33;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .r{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}.tool .r.ok{color:var(--rec)}.tool .r.add{color:var(--rec)}
.in{border-top:1px solid #e6e2d8;padding:10px 12px;position:relative}
.box{border:1px solid #d9d4c7;border-radius:12px;background:#fff;padding:9px 12px;min-height:58px;font-size:13.5px}
.box .t{white-space:pre-wrap}.box .ph2{color:#a8a294}.caret{display:inline-block;width:1.5px;height:15px;background:#1f1e1c;vertical-align:-2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.box .bar{display:flex;gap:8px;align-items:center;margin-top:6px;color:#8a8475;font-size:12px}.box .send{margin-left:auto;width:24px;height:24px;border-radius:7px;background:#d97757;color:#fff;text-align:center;line-height:24px;font-size:13px}
.slash{position:absolute;left:12px;right:12px;bottom:88px;background:#fff;border:1px solid #d9d4c7;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.1);padding:6px;font-size:12.5px}
.slash div{padding:5px 8px;border-radius:6px;display:flex;gap:10px}.slash .on{background:#f0eee6}.slash b{font-family:var(--mono);font-size:12px;min-width:110px}
.pop{animation:pop .35s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}
/* 트리 */
.tree{flex:1;overflow:auto;padding:8px 0;font-family:var(--mono);font-size:12px}
.tree button{display:flex;gap:6px;align-items:center;width:100%;padding:2px 12px;white-space:nowrap}
.tree button:hover{background:var(--soft)}.tree .d{color:var(--muted)}.tree .dim{color:#b3bac2}
.tree .sel{background:var(--devs)!important}
.mk{font-family:var(--sans);font-size:10px;font-weight:700;width:15px;height:15px;border-radius:3px;text-align:center;line-height:15px;margin-left:auto;flex:none}
.mA{background:var(--rec);color:#fff}.mM{background:var(--dev);color:#fff}
.tree .ch{font-weight:700;color:var(--ink)}.tree .flash{animation:fl 1.6s ease-out}@keyframes fl{0%{background:#ffe9a8}100%{background:transparent}}
.virt{font-family:var(--sans)!important;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;padding-top:6px!important}
.legend{border-top:1px solid var(--line);padding:6px 12px;font-size:11px;color:var(--muted);display:flex;gap:10px}
/* 보기 */
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow:hidden;flex-wrap:wrap}
.tabs button{font-family:var(--mono);font-size:11.5px;padding:4px 10px;border:1px solid transparent;border-bottom:0;color:var(--muted)}.tabs button.on{border-color:var(--line);background:var(--paper);color:var(--ink);margin-bottom:-1px}
.view{flex:1;overflow:auto;min-height:0}
.code{font-family:var(--mono);font-size:12px;line-height:1.55;margin:0;padding:8px 0}
.code div{padding:0 12px 0 52px;position:relative;white-space:pre-wrap;word-break:break-all;min-height:18px}
.code div::before{content:attr(data-n);position:absolute;left:0;width:40px;text-align:right;color:#aab1b9}
.code .a{background:#e6f4ea}.code .a::after{content:"+";position:absolute;left:44px;color:var(--rec)}.code .r{background:#fdecea;text-decoration:line-through;color:#8a3b33}.code .r::after{content:"−";position:absolute;left:44px;color:var(--bad)}
.code .cm{color:#6a737d}
.badge{font-size:11px;padding:1px 7px;border-radius:2px;font-weight:600}.b-new{background:var(--recs);color:var(--rec)}.b-mod{background:var(--devs);color:var(--dev)}
.vh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px}.vh .p{font-family:var(--mono)}
.note{margin:10px 12px;font-size:12.5px;background:var(--revs);border:1px solid #f0d9ae;color:#6b4300;padding:7px 10px}
/* GitHub PR */
.gh{padding:14px 18px}.gh h2{font-size:19px;margin:0 0 4px}.gh .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.state{display:inline-block;background:#1f883d;color:#fff;border-radius:12px;padding:1px 10px;font-size:12px;margin-right:6px}.state.m{background:#8250df}
.sec{border:1px solid var(--line);margin-bottom:7px}.sec .h{display:flex;gap:8px;padding:5px 10px;background:var(--soft);font-weight:600;font-size:12.5px}.sec .c{padding:5px 10px;font-size:12.5px;white-space:pre-wrap}
.who{font-size:10.5px;padding:0 6px;border-radius:2px;margin-left:auto}.w-ai{background:var(--devs);color:var(--dev)}.w-me{background:var(--revs);color:var(--rev)}
.sec.me{border-color:var(--rev);box-shadow:0 0 0 2px var(--revs)}
.checks{border:1px solid var(--line);margin:0 0 12px}.checks .hd{display:flex;gap:8px;align-items:center;padding:8px 10px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.checks .it{display:flex;gap:8px;padding:5px 10px;font-size:12.5px;align-items:center}.checks .it small{color:var(--muted);margin-left:auto}
.ok{color:var(--rec);font-weight:700}.no{color:var(--bad);font-weight:700}
.mergebar{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);font-size:13px}.mergebar .b{padding:5px 14px;border-radius:6px;font-weight:600}.mb-ok{background:#1f883d;color:#fff}.mb-no{background:var(--soft);color:#a0a8b1}
.typing::after{content:"";display:inline-block;width:1.5px;height:13px;background:var(--rev);margin-left:1px;animation:bl 1s steps(1) infinite}
/* 커밋 */
.commit{margin:12px;border:1px solid var(--line)}.commit .hd{padding:7px 10px;background:var(--soft);font-size:12.5px;font-weight:600;display:flex;gap:8px}.commit pre{margin:0;padding:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.term{margin:12px;background:#1e2329;color:#d6dde4;font-family:var(--mono);font-size:12px;padding:10px 12px;white-space:pre-wrap}.term .g{color:#7ee2a8}
/* 재생 */
.play{padding:14px 18px;display:flex;flex-direction:column;gap:12px;height:100%}
.trk{position:relative;height:56px}.trk .ln{position:absolute;left:10px;right:10px;top:14px;height:2px;background:var(--line)}
.trk .pt{position:absolute;top:4px;transform:translateX(-50%);text-align:center;font-size:11px;color:var(--muted);width:90px}
.trk .pt i{display:block;margin:0 auto 4px;width:22px;height:22px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-style:normal;line-height:18px;font-size:10px;font-weight:700}
.trk .pt.done i{background:var(--rec);border-color:var(--rec);color:#fff}.trk .pt.now i{box-shadow:0 0 0 5px var(--recs)}
.hist{border:1px solid var(--line);flex:1;overflow:auto;font-size:12.5px}.hist div{padding:4px 12px;border-bottom:1px dashed var(--line)}.hist .v{background:var(--soft);font-weight:700}
/* 비교 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;height:100%}
.lane{border:1px solid var(--line);padding:12px}.lane h3{margin:0 0 10px;font-size:15px;display:flex;gap:8px;align-items:center}
.tg{font-size:11px;padding:1px 7px;border-radius:2px}.t-doc{background:var(--soft);color:var(--muted);border:1px solid var(--line)}.t-site{background:var(--rec);color:#fff}
.fs{border:1px solid var(--line);padding:10px 12px;font-size:13px;margin-bottom:8px;opacity:.25;transition:all .4s}.fs.show{opacity:1}
.fs.bad{border-color:var(--bad);background:var(--bads)}.fs.ok{border-color:var(--rec);background:var(--recs)}.fs.warn{border-color:var(--rev);background:var(--revs)}
.fs b{margin-right:6px}
.img{padding:10px}.img img{width:100%;display:block;border:1px solid var(--line)}
.itabs{display:flex;gap:4px;padding:8px 10px 0}.itabs button{border:1px solid var(--line);padding:3px 10px;font-size:12px}.itabs .on{border-color:var(--rec);background:var(--recs)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}th{background:var(--soft)}
.log td,.log th{white-space:nowrap}.log td:nth-child(4){white-space:normal;min-width:220px}.log td:nth-child(5){max-width:180px;overflow:hidden;text-overflow:ellipsis}
.hlbox{outline:3px solid var(--hl);outline-offset:2px;border-radius:4px;animation:pl 1.6s infinite}@keyframes pl{50%{outline-color:#ffd56b}}

le) => file.version;\n}\n"}, {"path": "lib/log/log_store.dart", "status": "A", "before": null, "after": "/// 점검 로그 저장 · 보관\nclass LogStore {\n  static const keepDays = 30;\n  final List<(DateTime, String)> entries = [];\n\n  void write(String message, [DateTime? at]) {\n    entries.add((at ?? DateTime.now(), message));\n  }\n\n  /// 보관 기간이 지난 로그 삭제\n  void cleanup([DateTime? now]) {\n    final limit = (now ?? DateTime.now()).subtract(const Duration(days: keepDays));\n    entries.removeWhere((e) => e.$1.isBefore(limit));\n  }\n}\n"}, {"path": "pubspec.yaml", "status": "A", "before": null, "after": "name: inspection_tool\ndescription: 점검관리 툴 (시연용 미니 프로젝트)\nversion: 0.0.0\npublish_to: none\n\nenvironment:\n  sdk: ^3.0.0\n\ndev_dependencies:\n  test: ^1.24.0\n"}, {"path": "test/device_test.dart", "status": "A", "before": null, "after": "import 'package:inspection_tool/device/device_name.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('장치 이름 변경', () {\n    final d = Device('EL-01')..rename('EL-02');\n    expect(d.name, 'EL-02');\n  });\n}\n"}, {"path": "test/fw_update_test.dart", "status": "A", "before": null, "after": "import 'package:inspection_tool/fwupdate/fw_update.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('업데이트 후 파일 버전으로 바뀜', () {\n    expect(FwUpdater().start(Board('main', '1.0.0'), FirmwareFile('1.1.0')), '1.1.0');\n  });\n}\n"}, {"path": "test/log_store_test.dart", "status": "A", "before": null, "after": "import 'package:inspection_tool/log/log_store.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('보관 기간이 지난 로그 삭제', () {\n    final now = DateTime(2026, 11, 1);\n    final s = LogStore()\n      ..write('old', now.subtract(const Duration(days: 31)))\n      ..write('new', now);\n    s.cleanup(now);\n    expect(s.entries.map((e) => e.$2), ['new']);\n  });\n}\n"}]}, {"sha": "3e114e0", "subject": "착수: 규칙 문서 배치 (hdel-ai-coding 묶음 v1.0.0)", "message": "착수: 규칙 문서 배치 (hdel-ai-coding 묶음 v1.0.0)", "author": "개발 리더", "date": "2026-11-03", "tags": [], "tree": [".claude/settings.json", ".github/pull_request_template.md", ".gitignore", "AGENTS.md", "CLAUDE.md", "GEMINI.md", "README.md", "assets/config.json", "docs/AI_코딩_사용지침.md", "docs/HANDOVER.md", "docs/HISTORY.md", "lib/config.dart", "lib/device/device_name.dart", "lib/fwupdate/fw_update.dart", "lib/log/log_store.dart", "pubspec.yaml", "test/device_test.dart", "test/fw_update_test.dart", "test/log_store_test.dart"], "files": [{"path": ".claude/settings.json", "status": "A", "before": null, "after": "{\n  \"permissions\": {\n    \"deny\": [\"Read(./.env)\", \"Read(./.env.*)\", \"Read(./secrets/**)\", \"Read(./**/*.pem)\", \"Read(./**/*.key)\"]\n  },\n  \"extraKnownMarketplaces\": {\n    \"hdel\": { \"source\": { \"source\": \"github\", \"repo\": \"kiheon-jang/hdel-guardrails-demo-flow\" } }\n  },\n  \"enabledPlugins\": {\n    \"hdel-ai-coding@hdel\": true\n  }\n}\n"}, {"path": ".github/pull_request_template.md", "status": "A", "before": null, "after": "<!-- 칸마다 첫 주석이 작성 주체입니다: AI 초안 = AI가 채우고 개발자가 확인, 직접 작성 = 개발자가 직접 -->\n\n## 변경 내용 (요약)\n<!-- AI 초안 · 무엇을 바꿨는지 1~3줄 -->\n\n## 변경 이유 · 목적\n<!-- AI 초안 · 왜 바꿨는지, 관련 이슈 번호. 모르면 확인 필요 -->\n\n## 변경 유형\n<!-- AI 초안 · 추가 / 변경 / 수정 / 삭제 / 폐기 예정 / 보안 / 리팩터링 / 문서 / 긴급 -->\n\n## 테스트 내용\n<!-- AI 초안 · 실행한 테스트와 결과 (비개발 조직: 직접 써 본 결과) -->\n\n## AI 사용\n<!-- AI 초안 -->\n- [ ] 사용하지 않음\n- [ ] 사용함 — 도구: Claude Code / 범위: 설계·코드·테스트·문서 / 정도: 일부·상당 부분·대부분\n\n### 파일별 AI 기여 (AI 사용 시)\n<!-- AI 초안 -->\n| 파일 | AI 생성 / AI 생성 후 수정 / 직접 작성 |\n|---|---|\n|  |  |\n\n### 개발자 이해 확인 (AI 사용 시 필수)\n<!-- 직접 작성 · AI는 비워 둠 -->\n- 핵심 로직은 어떻게 동작하는가:\n- 우려되는 문제점은 무엇인가:\n- 왜 이 방식을 골랐는가 (검토한 대안):\n\n(비개발 조직은 아래 1문항)\n- 어떻게 확인했나:\n\n## 확인 필요 항목 설명 (해당 시)\n<!-- AI 초안 · 테스트 삭제·건너뛰기, CI 설정 변경, 외부 패키지 추가, 대규모 변경, 비밀정보 의심이 있으면 이유 -->\n\n## 위험도와 되돌리는 방법\n<!-- AI 초안 · 낮음 / 보통 / 높음. 보통 이상이면 되돌리는 방법 필수 -->\n\n## 결정 기록 (선택 · 구조 변경 시)\n<!-- AI 초안 · 개발자가 남기기로 한 경우만 -->\n- 배경:\n- 결정:\n- 검토한 대안:\n- 영향:\n\n## 알려진 문제 · 인계 메모\n<!-- AI 초안 · 다음 담당자가 알아야 할 것 -->\n"}, {"path": "AGENTS.md", "status": "A", "before": "# AGENTS.md — <프로젝트 이름>\n\n어떤 AI 코딩 도구(Claude Code · Codex · Cursor · GitHub Copilot 등)를 써도 같은 규칙을 따르게 하는 파일입니다.\n공통 규칙은 개발 리더, 프로젝트 정보(<꺾쇠> 자리: 개요 · 명령 · 폴더 · 코드 규칙)는 /hdel-ai-coding:신규적용 · /hdel-ai-coding:유지보수적용 때 AI가 저장소를 읽어 채우고 담당 개발자가 확인합니다.\n\n## 프로젝트 개요\n- 무엇: <한 줄 설명>\n- 사용자: <누가 쓰나>\n- 환경: <언어 · 프레임워크 · 배포 대상 · 특이 환경(오프라인 등)>\n- 조직: <개발 / 비개발> (비개발이면 이해 확인이 1문항)\n\n## 빌드 · 실행 · 테스트\n- 설치: <의존성 설치 명령>\n- 테스트: <테스트 명령> (PR 전 필수)\n\n## 폴더 구조\n| 폴더 | 역할 |\n|---|---|\n| <경로> | <역할> |\n| docs/ | 기록 문서 (아래 \"기록 위치\") |\n\n## 코드 규칙\n- 설정값은 <설정 파일>에 둔다. 코드에 고정하지 않는다\n- 기능마다 테스트를 함께 둔다\n- <프로젝트 고유 규칙>\n\n## 하지 말 것\n- 테스트를 삭제하거나 건너뛰게 만들지 않는다\n- main에 직접 반영하지 않는다\n- 비밀번호 · 키 · 토큰을 코드나 기록 문서에 넣지 않는다\n- 이유 없이 외부 패키지를 추가하지 않는다 (추가하면 이유를 PR 본문에)\n\n## 브랜치 · 커밋 · 병합\n- 브랜치: feature/<요약>, 긴급은 hotfix/<요약>\n- PR 생성 · 병합은 /hdel-ai-coding:병합요청 이 한다. 개발자 이해 확인과 최종 확인(\"올리고 병합할까요?\")을 받은 뒤에만 올리고 병합한다\n- 긴급 수정은 /hdel-ai-coding:병합긴급: 먼저 병합하고 이해 확인은 병합 뒤 바로 받는다\n- 커밋 메시지: 무엇을 했는지 한글 한 줄 + (#PR번호), AI 사용 표시(Co-Authored-By) 유지\n- 병합: PR 템플릿(.github/pull_request_template.md)으로 PR을 만들어 squash 병합한다. 자동 검사가 있으면 통과한 뒤에만 병합한다\n\n## 명령 (hdel-ai-coding 플러그인 · 확장)\n- /hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 · /hdel-ai-coding:인수인계 (매일), /hdel-ai-coding:신규적용 · /hdel-ai-coding:유지보수적용 (프로젝트마다 1회)\n- Claude Code 는 플러그인, Gemini CLI 는 확장으로 설치한다. 이해 확인 검사도 함께 들어 있다\n\n## 기록 위치\n기록 명령(/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 · /hdel-ai-coding:인수인계)과 사이트는 이 표의 경로를 따른다. 기본값은 docs/ 이고, 프로젝트에 같은 이름의 파일이 이미 있으면 여기서 바꾼다 (예: docs/ai-coding/).\n\n| 문서 | 경로 |\n|---|---|\n| 사용 지침 | docs/AI_코딩_사용지침.md |\n| 히스토리 | docs/HISTORY.md |\n| 인수인계 | docs/HANDOVER.md |\n| 결정 기록 (선택) | docs/결정기록/ |\n\n## 기록\n- PR을 만들 때: PR 본문(템플릿 형식) · 히스토리 항목 · 인수인계 갱신을 함께 작성한다 (같은 PR로 병합)\n- \"개발자 이해 확인\" 3문항은 AI가 채우지 않고 비워 둔다\n- 확인되지 않는 내용(이유 · 배경 등)은 지어내지 않고 \"확인 필요\"로 남긴다\n- 구조를 바꾸는 변경이면 결정 기록(결정 기록 폴더/NNNN-제목.md)을 남길지 개발자에게 묻는다 (선택)\n", "after": "# AGENTS.md — 점검관리 툴\n\n어떤 AI 코딩 도구(Claude Code · Codex · Cursor · GitHub Copilot 등)를 써도 같은 규칙을 따르게 하는 파일입니다.\n공통 규칙은 개발 리더, 프로젝트 정보(개요 · 명령 · 폴더)는 담당 개발자가 관리합니다.\n\n## 프로젝트 개요\n- 무엇: 현장 장비 점검 · 설정 · 펌웨어 업데이트 도구 (시연용 미니 프로젝트)\n- 사용자: 현장 엔지니어\n- 환경: Dart\n- 조직: 개발\n\n## 빌드 · 실행 · 테스트\n- 설치: dart pub get\n- 테스트: dart test (PR 전 필수)\n\n## 폴더 구조\n| 폴더 | 역할 |\n|---|---|\n| lib/device/ | 장치 이름 변경 |\n| lib/fwupdate/ | 펌웨어 업데이트 |\n| lib/log/ | 점검 로그 저장 · 보관 |\n| lib/config.dart · assets/config.json | 설정값 |\n| test/ | 테스트 |\n| docs/ | 기록 문서 (아래 \"기록 위치\") |\n\n## 코드 규칙\n- 설정값은 assets/config.json 에 둔다. 코드에 고정하지 않는다\n- 기능마다 test/ 에 테스트를 함께 둔다\n\n## 하지 말 것\n- 테스트를 삭제하거나 건너뛰게 만들지 않는다\n- main에 직접 반영하지 않는다\n- 비밀번호 · 키 · 토큰을 코드나 기록 문서에 넣지 않는다\n- 이유 없이 외부 패키지를 추가하지 않는다 (추가하면 이유를 PR 본문에)\n\n## 브랜치 · 커밋 · 병합\n- 브랜치: feature/<요약>, 긴급은 hotfix/<요약>\n- PR 생성 · 병합은 /hdel-ai-coding:병합요청 이 한다. 개발자 이해 확인과 최종 확인(\"올리고 병합할까요?\")을 받은 뒤에만 올리고 병합한다\n- 긴급 수정은 /hdel-ai-coding:병합긴급: 먼저 병합하고 이해 확인은 병합 뒤 바로 받는다\n- 커밋 메시지: 무엇을 했는지 한글 한 줄 + (#PR번호), AI 사용 표시(Co-Authored-By) 유지\n- 병합: PR 템플릿(.github/pull_request_template.md)으로 PR을 만들어 squash 병합한다. 자동 검사가 있으면 통과한 뒤에만 병합한다\n\n## 명령 (hdel-ai-coding 플러그인 · 확장)\n- /hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 · /hdel-ai-coding:인수인계 (매일), /hdel-ai-coding:신규적용 · /hdel-ai-coding:유지보수적용 (프로젝트마다 1회)\n- Claude Code 는 플러그인, Gemini CLI 는 확장으로 설치한다. 이해 확인 검사도 함께 들어 있다\n\n## 기록 위치\n기록 명령(/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 · /hdel-ai-coding:인수인계)과 사이트는 이 표의 경로를 따른다. 기본값은 docs/ 이고, 프로젝트에 같은 이름의 파일이 이미 있으면 여기서 바꾼다 (예: docs/ai-coding/).\n\n| 문서 | 경로 |\n|---|---|\n| 사용 지침 | docs/AI_코딩_사용지침.md |\n| 히스토리 | docs/HISTORY.md |\n| 인수인계 | docs/HANDOVER.md |\n| 결정 기록 (선택) | docs/결정기록/ |\n\n## 기록\n- PR을 만들 때: PR 본문(템플릿 형식) · 히스토리 항목 · 인수인계 갱신을 함께 작성한다 (같은 PR로 병합)\n- \"개발자 이해 확인\" 3문항은 AI가 채우지 않고 비워 둔다\n- 확인되지 않는 내용(이유 · 배경 등)은 지어내지 않고 \"확인 필요\"로 남긴다\n- 구조를 바꾸는 변경이면 결정 기록(결정 기록 폴더/NNNN-제목.md)을 남길지 개발자에게 묻는다 (선택)\n", "tpl": true}, {"path": "CLAUDE.md", "status": "A", "before": null, "after": "# CLAUDE.md\n\n@AGENTS.md\n\n## Claude Code 전용\n- 명령과 이해 확인 검사는 hdel-ai-coding 플러그인이 제공한다. 이 저장소의 .claude/settings.json 이 플러그인을 켜므로, 처음 열면 설치 안내가 뜬다\n- 병합할 때 /hdel-ai-coding:병합요청: PR 본문 · 히스토리 · 인수인계 작성 → 이해 확인 → 최종 확인 → PR 생성 · 병합 (긴급 수정은 /hdel-ai-coding:병합긴급)\n- 인수인계 내용은 /hdel-ai-coding:인수인계 로 본다 (경로는 AGENTS.md \"기록 위치\")\n- 커밋의 Co-Authored-By 표시를 지우지 않는다\n- .env · 키 파일은 읽지 않는다 (.claude/settings.json 에서 차단)\n"}, {"path": "GEMINI.md", "status": "A", "before": null, "after": "# GEMINI.md\n\n@./AGENTS.md\n\n## Gemini CLI 전용\n- 명령과 이해 확인 검사는 hdel-ai-coding 확장이 제공한다 (gemini extensions install <묶음 저장소>)\n- 병합할 때 /hdel-ai-coding:병합요청 (긴급 수정은 /hdel-ai-coding:병합긴급), 인수인계 보기는 /hdel-ai-coding:인수인계\n- 커밋에 AI 사용 표시(Co-Authored-By)를 남긴다\n- .env · 키 파일은 읽지 않는다\n"}, {"path": "docs/AI_코딩_사용지침.md", "status": "A", "before": null, "after": "# AI 코딩 도구 사용 지침\n\n- 적용 대상: 개발 업무에 AI 코딩 도구를 쓰는 모든 인원 (개발 조직 · 비개발 조직)\n- 목적: AI를 써도 사내 정보가 새지 않고, 바뀐 코드의 이유와 책임이 남게 한다\n- 작성 · 개정: 개발 리더 / 정보보호 담당\n\n## 1. 도구와 계정\n- 회사가 계약한 AI 도구 계정으로만 업무 코드를 다룬다 (기본: Claude Code)\n- 개인 계정 · 무료 웹 챗봇에 사내 코드 · 문서를 넣지 않는다\n- 새 도구를 쓰려면 개발 리더 · 정보보호 담당에게 먼저 확인한다\n\n## 2. 입력 금지 정보\n| 구분 | 예 | 대신 |\n|---|---|---|\n| 개인정보 | 고객 이름 · 연락처 · 현장 주소 | 가짜 데이터로 바꿔 입력 |\n| 비밀정보 | 비밀번호 · API 키 · 토큰 · 인증서 | 변수 이름만 쓰고 값은 빼기 |\n| 대외비 | 계약서 · 인사 자료 · 미공개 설계값 원본 | 필요한 부분만 요약해 입력 |\n\n## 3. 개발자 책임\n- AI가 만든 코드도 병합한 개발자가 이해하고 책임진다\n- 설명할 수 없는 코드는 병합하지 않는다\n- AI를 썼다면 PR의 \"개발자 이해 확인\" 3문항(핵심 로직 · 우려되는 문제점 · 고른 이유)을 직접 쓴다\n- 테스트를 지우거나 건너뛰게 만들어 통과시키지 않는다\n\n## 4. AI 사용 기록\n- 커밋의 AI 사용 표시(Co-Authored-By)를 지우지 않는다\n- PR 템플릿의 AI 사용 · 파일별 AI 기여가 맞는지 확인한다. 다른 AI 도구를 썼다면 알린다\n- AI가 작성한 PR 본문 · 히스토리 · 인수인계는 개발자가 읽고 확인한 뒤 올린다\n\n## 5. 병합 절차\n1. 기능 브랜치에서 작업하고 테스트한다\n2. /hdel-ai-coding:병합요청 을 실행한다 — AI가 PR 본문 · 히스토리 항목 · 인수인계 갱신을 함께 작성\n3. 개발자가 내용을 확인하고, AI가 대화에서 묻는 이해 확인 3문항에 직접 답한다 (답은 원문 그대로 PR에 들어가고, 비어 있으면 PR이 올라가지 않는다)\n4. AI가 다시 보여 주는 최종 내용을 확인하고 \"예\"라고 답하면 PR 생성 · 병합까지 진행된다 (main 직접 반영 금지, 자동 검사가 있으면 통과해야 병합)\n- 긴급 수정은 /hdel-ai-coding:병합긴급: 먼저 병합하고, 이해 확인은 병합 직후 이어서 답한다\n\n## 6. 기록\n- PR마다: PR 본문 + 히스토리 항목 + 인수인계 갱신 (같은 PR로 병합). PR 본문은 병합 커밋 메시지에도 그대로 남는다\n- 인수인계 내용 보기: /hdel-ai-coding:인수인계\n- 기록 문서 위치는 AGENTS.md \"기록 위치\" 표 (기본 docs/)\n- 확인되지 않은 내용은 지어내지 않고 \"확인 필요\"로 남긴다\n\n## 7. 사고가 났을 때\n- 비밀정보를 커밋했으면 이력을 지우기 전에 키 · 비밀번호부터 바꾸고 정보보호 담당에게 알린다\n- 입력 금지 정보를 AI에 넣었으면 정보보호 담당에게 알린다\n\n## 8. 관련 문서 · 문의\n- AI 규칙 문서 (AGENTS.md · CLAUDE.md · GEMINI.md), 명령 (hdel-ai-coding 플러그인 · 확장), PR 템플릿 문서 (.github/pull_request_template.md), 히스토리 문서 · 인수인계 문서 (위치: AGENTS.md \"기록 위치\")\n- 문의: 개발 리더 / 정보보호 담당\n"}, {"path": "docs/HANDOVER.md", "status": "A", "before": null, "after": "<!--\n인수인계 문서 형식 (/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 이 PR마다 바뀐 부분만 고침, 개발자 확인 · 보기는 /hdel-ai-coding:인수인계)\n- 근거: 히스토리 문서, 결정 기록, git log 통계, AGENTS.md\n- 내용마다 출처(PR 번호 · 히스토리 · git 통계 · 확인 필요)를 붙인다. 비밀번호 · 키 값은 적지 않는다\n- 확인되지 않은 이유는 지어내지 않고 8번 \"확인 필요 질문\"으로 옮긴다\n\n# <프로젝트> 인수인계 (PR #번호 기준, YYYY-MM-DD)\n## 1. 한눈 요약          | 무엇 | 환경 | 규모(최근 PR 수 · 테스트 수) | 담당(현 담당 · 지원) |\n## 2. 실행 방법          빌드 · 실행 · 테스트 명령, 필요한 장비 · 계정 · 설정 파일 (값은 적지 않음)\n## 3. 주요 기능과 위치   | 기능 | 위치 | 설명 |\n## 4. 구성               | 영역 | 역할 | AI 비중 | 주 작성자 |\n## 5. 가장 많이 바뀐 곳  | 영역 | 변경 횟수 | 관련 PR · 이유 |\n## 6. 관리 포인트        [높음] 작성자 1명 · AI 비중 높은데 이해 확인 1명뿐 · 손으로 갱신하는 설정 / [보통] 테스트 없는 영역 · 외부 패키지 · 이해 확인 병합 뒤 작성 남은 긴급 PR\n## 7. 주요 결정          | 결정 | 이유 | 출처 (PR · 결정 기록) |\n## 8. 미해결 메모 · 확인 필요 질문  | 내용 | 출처 |\n## 9. 인계 체크리스트    - [ ] 빌드 · 테스트 실행 - [ ] 관리 포인트 영역 코드 읽기 - [ ] 핵심 기능 1회 실행 - [ ] 계정 · 권한 이전\n-->\n# 점검관리 툴 인수인계\n\n(첫 PR의 /hdel-ai-coding:병합요청 때부터 채워짐)\n"}, {"path": "docs/HISTORY.md", "status": "A", "before": null, "after": "<!--\n히스토리 문서 형식 (/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 이 PR마다 같은 브랜치에서 추가, 개발자 확인)\n- 최신 항목이 위. 제목 바로 아래에 추가한다. 버전은 git 태그로 관리한다\n- PR 본문에서 옮겨 적는다. PR에 없는 내용을 새로 만들지 않는다. 이유를 모르면 \"확인 필요\"\n- 유형: 기능 · 수정 · 긴급 · 보안 · 리팩터링 · 문서\n\n## [유형] <PR 제목> (#번호) · YYYY-MM-DD\n- 담당: <개발자> · AI: <도구 / 정도> · 위험도: <낮음 · 보통 · 높음>\n- 내용과 이유: <무엇을 ays));\n    entries.removeWhere((e) => e.$1.isBefore(limit));\n  }\n}\n", "after": "import '../config.dart';\n\n/// 점검 로그 저장 · 보관\nclass LogStore {\n  final int keepDays;\n  final int maxEntries;\n  final List<(DateTime, String)> entries = [];\n\n  LogStore({this.keepDays = 30, this.maxEntries = 1000});\n\n  /// 보관 기간은 assets/config.json 의 log_keep_days\n  factory LogStore.fromConfig(Config c) =>\n      LogStore(keepDays: c.values['log_keep_days'] as int? ?? 30);\n\n  /// 저장 한도를 넘으면 가장 오래된 로그부터 지우고 저장\n  void write(String message, [DateTime? at]) {\n    if (entries.length >= maxEntries) entries.removeAt(0);\n    entries.add((at ?? DateTime.now(), message));\n  }\n\n  /// 보관 기간이 지난 로그 삭제\n  void cleanup([DateTime? now]) {\n    final limit = (now ?? DateTime.now()).subtract(Duration(days: keepDays));\n    entries.removeWhere((e) => e.$1.isBefore(limit));\n  }\n}\n"}, {"path": "test/log_store_test.dart", "status": "M", "before": "import 'package:inspection_tool/config.dart';\nimport 'package:inspection_tool/log/log_store.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('보관 기간이 지난 로그 삭제', () {\n    final now = DateTime(2026, 11, 1);\n    final s = LogStore()\n      ..write('old', now.subtract(const Duration(days: 31)))\n      ..write('new', now);\n    s.cleanup(now);\n    expect(s.entries.map((e) => e.$2), ['new']);\n  });\n\n  test('보관 기간을 설정값에서 읽음', () {\n    expect(LogStore.fromConfig(Config({'log_keep_days': 7})).keepDays, 7);\n  });\n}\n", "after": "import 'package:inspection_tool/config.dart';\nimport 'package:inspection_tool/log/log_store.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('보관 기간이 지난 로그 삭제', () {\n    final now = DateTime(2026, 11, 1);\n    final s = LogStore()\n      ..write('old', now.subtract(const Duration(days: 31)))\n      ..write('new', now);\n    s.cleanup(now);\n    expect(s.entries.map((e) => e.$2), ['new']);\n  });\n\n  test('보관 기간을 설정값에서 읽음', () {\n    expect(LogStore.fromConfig(Config({'log_keep_days': ';\n\nimport 'package:pub_semver/pub_semver.dart';\n\nimport 'fw_update.dart';\n\nenum Compat { ok, blocked, unknown }\n\n/// 펌웨어 호환표 (assets/fw_compat.json): 펌웨어 버전 → 보드 종류별 허용 현재 버전 범위\nclass CompatChecker {\n  final Map<String, dynamic> table;\n  CompatChecker(this.table);\n\n  factory CompatChecker.load([String path = 'assets/fw_compat.json']) =>\n      CompatChecker(jsonDecode(File(path).readAsStringSync()) as Map<String, dynamic>);\n\n  Compat check(Board board, FirmwareFile file) {\n    final rule = (table[file.version] as Map?)?[board.type] as String?;\n    if (rule == null) return Compat.blocked;\n    if (board.version.isEmpty) return Compat.unknown; // 구형 보드는 버전을 주지 않음\n    return VersionConstraint.parse(rule).allows(Version.parse(board.version))\n        ? Compat.ok\n        : Compat.blocked;\n  }\n}\n"}, {"path": "lib/fwupdate/fw_update.dart", "status": "M", "before": "/// 펌웨어 업데이트\nclass Board {\n  final String type;\n  final String version;\n  Board(this.type, this.version);\n}\n\nclass FirmwareFile {\n  final String version;\n  FirmwareFile(this.version);\n}\n\nclass FwUpdater {\n  /// 업데이트를 시작하고 결과 버전을 돌려준다\n  String start(Board board, FirmwareFile file) => file.version;\n}\n", "after": "import 'compat_check.dart';\n\n/// 펌웨어 업데이트\nclass Board {\n  final String type;\n  final String version;\n  Board(this.type, this.version);\n}\n\nclass FirmwareFile {\n  final String version;\n  FirmwareFile(this.version);\n}\n\nclass FwUpdater {\n  final CompatChecker? checker;\n  FwUpdater([this.checker]);\n\n  /// 업데이트를 시작하고 결과 버전을 돌려준다.\n  /// 호환표에 없으면 막고, 보드 버전을 알 수 없으면 엔지니어가 확인한 뒤 force 로 진행\n  String start(Board board, FirmwareFile file, {bool force = false}) {\n    final r = checker?.check(board, file) ?? Compat.ok;\n    if (r == Compat.blocked) throw StateError('호환되지 않는 펌웨어');\n    if (r == Compat.unknown && !force) throw StateError('확인 불가: 보드 버전을 알 수 없음');\n    return file.version;\n  }\n}\n"}, {"path": "pubspec.yaml", "status": "M", "before": "name: inspe d", "status": "A", "before": null, "after": "# 점검관리 툴 (시연용)\n\n현장 장비 점검 · 설정 · 펌웨어 업데이트 흐름을 흉내 낸 미니 프로젝트입니다. 관리 흐름 시연용이라 기본 구조만 있습니다.\n\n- 설치: `dart pub get`\n- 테스트: `dart test`\n\n| 폴더 | 역할 |\n|---|---|\n| `lib/device/` | 장치 이름 변경 |\n| `lib/fwupdate/` | 펌웨어 업데이트 |\n| `lib/log/` | 점검 로그 저장 · 보관 |\n| `lib/config.dart` · `assets/config.json` | 설정값 |\n"}, {"path": "assets/config.json", "status": "A", "before": null, "after": "{\n  \"site_name\": \"시연 현장\"\n}\n"}, {"path": "lib/config.dart", "status": "A", "before": null, "after": "import 'dart:convert';\nimport 'dart:io';\n\n/// assets/config.json 설정값\nclass Config {\n  final Map<String, dynamic> values;\n  Config(this.values);\n\n  factory Config.load([String path = 'assets/config.json']) =>\n      Config(jsonDecode(File(path).readAsStringSync()) as Map<String, dynamic>);\n}\n"}, {"path": "lib/device/device_name.dart", "status": "A", "before": null, "after": "/// 장치 이름 변경\nclass Device {\n  String name;\n  Device(this.name);\n\n  void rename(String newName) {\n    name = newName;\n  }\n}\n"}, {"path": "lib/fwupdate/fw_update.dart", "status": "A", "before": null, "after": "/// 펌웨어 업데이트\nclass Board {\n  final String type;\n  final String version;\n  Board(this.type, this.version);\n}\n\nclass FirmwareFile {\n  final String version;\n  FirmwareFile(this.version);\n}\n\nclass FwUpdater {\n  /// 업데이트를 시작하고 결과 버전을 돌려준다\n  String start(Board board, FirmwareFile file) => file.version;\n}\n"}, {"path": "lib/log/log_store.dart", "status": "A", "before": null, "after": "/// 점검 로그 저장 · 보관\nclass LogStore {\n  static const keepDays = 30;\n  final List<(DateTime, String)> entries = [];\n\n  void write(String message, [DateTime? at]) {\n    entries.add((at ?? DateTime.now(), message));\n  }\n\n  /// 보관 기간이 지난 로그 삭제\n  void cleanup([DateTime? now]) {\n    final limit = (now ?? DateTime.now()).subtract(const Duration(days: keepDays));\n    entries.removeWhere((e) => e.$1.isBefore(limit));\n  }\n}\n"}, {"path": "pubspec.yaml", "status": "A", "before": null, "after": "name: inspection_tool\ndescription: 점검관리 툴 (시연용 미니 프로젝트)\nversion: 0.0.0\npublish_to: none\n\nenvironment:\n  sdk: ^3.0.0\n\ndev_dependencies:\n  test: ^1.24.0\n"}, {"path": "test/device_test.dart", "status": "A", "before": null, "after": "import 'package:inspection_tool/device/device_name.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('장치 이름 변경', () {\n    final d = Device('EL-01')..rename('EL-02');\n    expect(d.name, 'EL-02');\n  });\n}\n"}, {"path": "test/fw_update_test.dart", "status": "A", "before": null, "after": "import 'package:inspection_tool/fwupdate/fw_update.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('업데이트 후 파일 버전으로 바뀜', () {\n    expect(FwUpdater().start(Board('main', '1.0.0'), FirmwareFile('1.1.0')), '1.1.0');\n  });\n}\n"}, {"path": "test/log_store_test.dart", "status": "A", "before": null, "after": "import 'package:inspection_tool/log/log_store.dart';\nimport 'package:test/test.dart';\n\nvoid main() {\n  test('보관 기간이 지난 로그 삭제', () {\n    final now = DateTime(2026, 11, 1);\n    final s = LogStore()\n      ..write('old', now.subtract(const Duration(days: 31)))\n      ..write('new', now);\n    s.cleanup(now);\n    expect(s.entries.map((e) => e.$2), ['new']);\n  });\n}\n"}]}, {"sha": "8f8d8aa", "subject": "펌웨어 업데이트 재시도 3회", "message": "펌웨어 업데이트 재시도 3회", "author": "개발자C", "date": "2025-03-20", "tags": [], "tree": [".gitignore", "README.md", "assets/config.json", "lib/config.dart", "lib/device/device_name.dart", "lib/fwupdate/fw_update.dart", "lib/log/log_store.dart", "pubspec.yaml", "test/device_test.dart", "test/fw_update_test.dart", "test/log_store_test.dart"], "files": [{"path": "lib/fwupdate/fw_update.dart", "status": "M", "before": "/// 펌웨어 업데이트\nclass Board {\n  final String type;\n  final String version;\n  Board(this.type, this.version);\n}\n\nclass FirmwareFile {\n  final String version;\n  FirmwareFile(this.version);\n}\n\nclass FwUpdater {\n  /// 업데이트를 시작하고 결과 버전을 돌려준다     entries.removeWhere((e) => e.$1.isBefore(limit));\n  }\n}\n", "after": "/// 점검 로그 저장 · 보관 (30일)\nclass LogStore {\n  static const keepDays = 30;\n  final List<(DateTime, String)> entries = [];\n\n  void write(String message, [DateTime? at]) {\n    entries.add((at ?? DateTime.now(), message));\n  }\n\n  /// 최신순 조회\n  List<String> latest() => entries.reversed.map((e) => e.$2).toList();\n\n  /// 보관 기간이 지난 로그 삭제\n  void cleanup([DateTime? now]) {\n    final limit = (now ?? DateTime.now()).subtract(const Duration(days: keepDays));\n    entries.removeWhere((e) => e.$1.isBefore(limit));\n  }\n}\n"}]}, {"sha": "234b621", "subject": "fwupdate 오류 메시지 수정", "message": "fwupdate 오류 메시지 수정", "author": "개발자A", "date": "2026-03-03", "tags": ["v1.2.0"], "tree": [".gitignore", "README.md", "assets/config.json", "lib/config.dart", "lib/device/device_name.dart", "lib/fwupdate/fw_update.dart", "lib/log/log_store.dart", "pubspec.yaml", "test/device_test.dart", "test/fw_update_test.dart", "test/log_store_test.dart"], "files": [{"path": "lib/fwupdate/fw_update.dart", "status": "M", "before": "/// 펌웨어 업데이트 (진행률 표시)\nclass Board {\n  final String type;\n  final String version;\n  Board(this.type, this.version);\n}\n\n/// 파일 버전 형식 검증\nclass FirmwareFile {\n  final String version;\n  FirmwareFile(this.version);\n}\n\nclass FwUpdater {\n  static const retry = 3;\n  /// 업데이트를 시작하고 결과 버전을 돌려준다\n  String start(Board board, FirmwareFile file) => file.version;\n}\n", "after": "/// 펌웨어 업데이트 (진행률 표시)\nclass Board {\n  final String type;\n  final String version;\n  Board(this.type, this.version);\n}\n\n/// 파일 버전 형식 검증\nclass FirmwareFile {\n  final String version;\n  FirmwareFile(this.version);\n}\n\nclass FwUpdater {\n  static const retry = 3;\n  /// (오류 메시지 정리) 업데이트를 시작하고 결과 버전을 돌려준다\n  String start(Board board, FirmwareFile file) => file.version;\n}\n"}]}, {"sha": "41e4934", "subject": "[기준선] AI 코딩 관리체계 적용 (#1)", "message": "[기준선] AI 코딩 관리체계 적용 (#1)\n\nCo-Authored-By: Claude <noreply@anthropic.com>", "author": "개발 리더", "date": "2026-11-02", "tags": [], "tree": [".claude/settings.json", ".github/pull_request_template.md", ".gitignore", "AGENTS.md", "CLAUDE.md", "GEMINI.md", "README.md", "assets/config.json", "docs/AI_코딩_사용지침.md", "docs/HANDOVER.md", "docs/HISTORY.md", "lib/config.dart", "lib/device/device_name.dart", "lib/fwupdate/fw_update.dart", "lib/log/log_store.dart", "pubspec.yaml", "test/device_test.dart", "test/fw_update_test.dart", "test/log_store_test.dart"], "files": [{"path": ".claude/settings.json", "status": "A", "before": null, "after": "{\n  \"permissions\": {\n    \"deny\": [\"Read(./.env)\", \"Read(./.env.*)\", \"Read(./secrets/**)\", \"Read(./**/*.pem)\", \"Read(./**/*.key)\"]\n  },\n  \"extraKnownMarketplaces\": {\n    \"hdel\": { \"source\": { \"source\": \"github\", \"repo\": \"kiheon-jang/hdel-guardrails-demo-flow\" } }\n  },\n  \"enabledPlugins\": {\n    \"hdel-ai-coding@hdel\": true\n  }\n}\n"}, {"path": ".github/pull_request_template.md", "status": "A", "before": null, "after": "<!-- 칸마다 첫 주석이 작성 주체입니다: AI 초안 = AI가 채우고 개발자가 확인, 직접 작성 = 개발자가 직접 -->\n\n## 변경 내용 (요약)\n<!-- AI 초안 · 무엇을 바꿨는지 1~3줄 -->\n\n## 변경 이유 · 목적\n<!-- AI 초안 · 왜 바꿨는지, 관련 이슈 번호. 모르면 확인 필요 -->\n\n## 변경 유형\n<!-- AI 초안 · 추가 / 변경 / 수정 / 삭제 / 폐기 예정 / 보안 / 리팩터링 / 문서 / 긴급 -->\n\n## 테스트 내용\n<!-- AI 초안 · 실행한 테스트와 결과 (비개발 조직: 직접 써 본 결과) -->\n\n## AI 사용\n<!-- AI 초안 -->\n- [ ] 사용하지 않음\n- [ ] 사용함 — 도구: Claude Code / 범위: 설계·코드·테스트·문서 / 정도: 일부·상당 부분·대부분\n\n### 파일별 AI 기여 (AI 사용 시)\n<!-- AI 초안 -->\n| 파일 | AI 생성 / AI 생성 후 수정 / 직접 작성 |\n|---|---|\n|  |  |\n\n### 개발자 이해 확인 (AI 사용 시 필수)\n<!-- 직접 작성 · AI는 비워 둠 -->\n- 핵심 로직은 어떻게 동작하는가:\n- 우려되는 문제점은 무엇인가:\n- 왜 이 방식을 골랐는가 (검토한 대안):\n\n(비개발 조직은 아래 1문항)\n- 어떻게 확인했나:\n\n## 확인 필요 항목 설명 (해당 시)\n<!-- AI 초안 · 테스트 삭제·건너뛰기, CI 설정 변경, 외부 패키지 추가, 대규모 변경, 비밀정보 의심이 있으면 이유 -->\n\n## 위험도와 되돌리는 방법\n<!-- AI 초안 · 낮음 / 보통 / 높음. 보통 이상이면 되돌리는 방법 필수 -->\n\n## 결정 기록 (선택 · 구조 변경 시)\n<!-- AI 초안 · 개발자가 남기기로 한 경우만 -->\n- 배경:\n- 결정:\n- 검토한 대안:\n- 영향:\n\n## 알려진 문제 · 인계 메모\n<!-- AI 초안 · 다음 담당자가 알아야 할 것 -->\n"}, {"path": "AGENTS.md", "status": "A", "before": null, "after": "# AGENTS.md — 점검관리 툴\n\n어떤 AI 코딩 도구(Claude Code · Codex · Cursor · GitHub Copilot 등)를 써도 같은 규칙을 따르게 하는 파일입니다.\n공통 규칙은 개발 리더, 프로젝트 정보(개요 · 명령 · 폴더)는 담당 개발자가 관리합니다.\n\n## 프로젝트 개요\n- 무엇: 현장 장비 점검 · 설정 · 펌웨어 업데이트 도구 (시연용 미니 프로젝트)\n- 사용자: 현장 엔지니어\n- 환경: Dart\n- 조직: 개발\n\n## 빌드 · 실행 · 테스트\n- 설치: dart pub get\n- 테스트: dart test (PR 전 필수)\n\n## 폴더 구조\n| 폴더 | 역할 |\n|---|---|\n| lib/device/ | 장치 이름 변경 |\n| lib/fwupdate/ | 펌웨어 업데이트 |\n| lib/log/ | 점검 로그 저장 · 보관 |\n| lib/config.dart · assets/config.json | 설정값 |\n| test/ | 테스트 |\n| docs/ | 기록 문서 (아래 \"기록 위치\") |\n\n## 코드 규칙\n- 설정값은 assets/config.json 에 둔다. 코드에 고정하지 않는다\n- 기능마다 test/ 에 테스트를 함께 둔다\n\n## 하지 말 것\n- 테스트를 삭제하거나 건너뛰게 만들지 않는다\n- main에 직접 반영하지 않는다\n- 비밀번호 · 키 · 토큰을 코드나 기록 문서에 넣지 않는다\n- 이유 없이 외부 패키지를 추가하지 않는다 (추가하면 이유를 PR 본문에)\n\n## 브랜치 · 커밋 · 병합\n- 브랜치: feature/<요약>, 긴급은 hotfix/<요약>\n- PR 생성 · 병합은 /hdel-ai-coding:병합요청 이 한다. 개발자 이해 확인과 최종 확인(\"올리고 병합할까요?\")을 받은 뒤에만 올리고 병합한다\n- 긴급 수정은 /hdel-ai-coding:병합긴급: 먼저 병합하고 이해 확인은 병합 뒤 바로 받는다\n- 커밋 메시지: 무엇을 했는지 한글 한 줄 + (#PR번호), AI 사용 표시(Co-Authored-By) 유지\n- 병합: PR 템플릿(.github/pull_request_template.md)으로 PR을 만들어 squash 병합한다. 자동 검사가 있으면 통과한 뒤에만 병합한다\n\n## 명령 (hdel-ai-coding 플러그인 · 확장)\n- /hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 · /hdel-ai-coding:인수인계 (매일), /hdel-ai-coding:신규적용 · /hdel-ai-coding:유지보수적용 (프로젝트마다 1회)\n- Claude Code 는 플러그인, Gemini CLI 는 확장으로 설치한다. 이해 확인 검사도 함께 들어 있다\n\n## 기록 위치\n기록 명령(/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 · /hdel-ai-coding:인수인계)과 사이트는 이 표의 경로를 따른다. 기본값은 docs/ 이고, 프로젝트에 같은 이름의 파일이 이미 있으면 여기서 바꾼다 (예: docs/ai-coding/).\n\n| 문서 | 경로 |\n|---|---|\n| 사용 지침 | docs/AI_코딩_사용지침.md |\n| 히스토리 | docs/HISTORY.md |\n| 인수인계 | docs/HANDOVER.md |\n| 결정 기록 (선택) | docs/결정기록/ |\n\n## 기록\n- PR을 만들 때: PR 본문(템플릿 형식) · 히스토리 항목 · 인수인계 갱신을 함께 작성한다 (같은 PR로 병합)\n- \"개발자 이해 확인\" 3문항은 AI가 채우지 않고 비워 둔다\n- 확인되지 않는 내용(이유 · 배경 등)은 지어내지 않고 \"확인 필요\"로 남긴다\n- 구조를 바꾸는 변경이면 결정 기록(결정 기록 폴더/NNNN-제목.md)을 남길지 개발자에게 묻는다 (선택)\n"}, {"path": "CLAUDE.md", "status": "A", "before": null, "after": "# CLAUDE.md\n\n@AGENTS.md\n\n## Claude Code 전용\n- 명령과 이해 확인 검사는 hdel-ai-coding 플러그인이 제공한다. 이 저장소의 .claude/settings.json 이 플러그인을 켜므로, 처음 열면 설치 안내가 뜬다\n- 병합할 때 /hdel-ai-coding:병합요청: PR 본문 · 히스토리 · 인수인계 작성 → 이해 확인 → 최종 확인 → PR 생성 · 병합 (긴급 수정은 /hdel-ai-coding:병합긴급)\n- 인수인계 내용은 /hdel-ai-coding:인수인계 로 본다 (경로는 AGENTS.md \"기록 위치\")\n- 커밋의 Co-Authored-By 표시를 지우지 않는다\n- .env · 키 파일은 읽지 않는다 (.claude/settings.json 에서 차단)\n"}, {"path": "GEMINI.md", "status": "A", "before": null, "after": "# GEMINI.md\n\n@./AGENTS.md\n\n## Gemini CLI 전용\n- 명령과 이해 확인 검사는 hdel-ai-coding 확장이 제공한다 (gemini extensions install <묶음 저장소>)\n- 병합할 때 /hdel-ai-coding:병합요청 (긴급 수정은 /hdel-ai-coding:병합긴급), 인수인계 보기는 /hdel-ai-coding:인수인계\n- 커밋에 AI 사용 표시(Co-Authored-By)를 남긴다\n- .env · 키 파일은 읽지 않는다\n"}, {"path": "docs/AI_코딩_사용지침.md", "status": "A", "before": null, "after": "# AI 코딩 도구 사용 지침\n\n- 적용 대상: 개발 업무에 AI 코딩 도구를 쓰는 모든 인원 (개발 조직 · 비개발 조직)\n- 목적: AI를 써도 사내 정보가 새지 않고, 바뀐 코드의 이유와 책임이 남게 한다\n- 작성 · 개정: 개발 리더 / 정보보호 담당\n\n## 1. 도구와 계정\n- 회사가 계약한 AI 도구 계정으로만 업무 코드를 다룬다 (기본: Claude Code)\n- 개인 계정 · 무료 웹 챗봇에 사내 코드 · 문서를 넣지 않는다\n- 새 도구를 쓰려면 개발 리더 · 정보보호 담당에게 먼저 확인한다\n\n## 2. 입력 금지 정보\n| 구분 | 예 | 대신 |\n|---|---|---|\n| 개인정보 | 고객 이름 · 연락처 · 현장 주소 | 가짜 데이터로 바꿔 입력 |\n| 비밀정보 | 비밀번호 · API 키 · 토큰 · 인증서 | 변수 이름만 쓰고 값은 빼기 |\n| 대외비 | 계약서 · 인사 자료 · 미공개 설계값 원본 | 필요한 부분만 요약해 입력 |\n\n## 3. 개발자 책임\n- AI가 만든 코드도 병합한 개발자가 이해하고 책임진다\n- 설명할 수 없는 코드는 병합하지 않는다\n- AI를 썼다면 PR의 \"개발자 이해 확인\" 3문항(핵심 로직 · 우려되는 문제점 · 고른 이유)을 직접 쓴다\n- 테스트를 지우거나 건너뛰게 만들어 통과시키지 않는다\n\n## 4. AI 사용 기록\n- 커밋의 AI 사용 표시(Co-Authored-By)를 지우지 않는다\n- PR 템플릿의 AI 사용 · 파일별 AI 기여가 맞는지 확인한다. 다른 AI 도구를 썼다면 알린다\n- AI가 작성한 PR 본문 · 히스토리 · 인수인계는 개발자가 읽고 확인한 뒤 올린다\n\n## 5. 병합 절차\n1. 기능 브랜치에서 작업하고 테스트한다\n2. /hdel-ai-coding:병합요청 을 실행한다 — AI가 PR 본문 · 히스토리 항목 · 인수인계 갱신을 함께 작성\n3. 개발자가 내용을 확인하고, AI가 대화에서 묻는 이해 확인 3문항에 직접 답한다 (답은 원문 그대로 PR에 들어가고, 비어 있으면 PR이 올라가지 않는다)\n4. AI가 다시 보여 주는 최종 내용을 확인하고 \"예\"라고 답하면 PR 생성 · 병합까지 진행된다 (main 직접 반영 금지, 자동 검사가 있으면 통과해야 병합)\n- 긴급 수정은 /hdel-ai-coding:병합긴급: 먼저 병합하고, 이해 확인은 병합 직후 이어서 답한다\n\n## 6. 기록\n- PR마다: PR 본문 + 히스토리 항목 + 인수인계 갱신 (같은 PR로 병합). PR 본문은 병합 커밋 메시지에도 그대로 남는다\n- 인수인계 내용 보기: /hdel-ai-coding:인수인계\n- 기록 문서 위치는 AGENTS.md \"기록 위치\" 표 (기본 docs/)\n- 확인되지 않은 내용은 지어내지 않고 \"확인 필요\"로 남긴다\n\n## 7. 사고가 났을 때\n- 비밀정보를 커밋했으면 이력을 지우기 전에 키 · 비밀번호부터 바꾸고 정보보호 담당에게 알린다\n- 입력 금지 정보를 AI에 넣었으면 정보보호 담당에게 알린다\n\n## 8. 관련 문서 · 문의\n- AI 규칙 문서 (AGENTS.md · CLAUDE.md · GEMINI.md), 명령 (hdel-ai-coding 플러그인 · 확장), PR 템플릿 문서 (.github/pull_request_template.md), 히스토리 문서 · 인수인계 문서 (위치: AGENTS.md \"기록 위치\")\n- 문의: 개발 리더 / 정보보호 담당\n"}, {"path": "docs/HANDOVER.md", "status": "A", "before": null, "after": "<!--\n인수인계 문서 형식 (/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 이 PR마다 바뀐 부분만 고침, 개발자 확인 · 보기는 /hdel-ai-coding:인수인계)\n- 근거: 히스토리 문서, 결정 기록, git log 통계, AGENTS.md\n- 내용마다 출처(PR 번호 · 히스토리 · git 통계 · 확인 필요)를 붙인다. 비밀번호 · 키 값은 적지 않는다\n- 확인되지 않은 이유는 지어내지 않고 8번 \"확인 필요 질문\"으로 옮긴다\n\n# <프로젝트> 인수인계 (PR #번호 기준, YYYY-MM-DD)\n## 1. 한눈 요약          | 무엇 | 환경 | 규모(최근 PR 수 · 테스트 수) | 담당(현 담당 · 지원) |\n## 2. 실행 방법          빌드 · 실행 · 테스트 명령, 필요한 장비 · 계정 · 설정 파일 (값은 적지 않음)\n## 3. 주요 기능과 위치   | 기능 | 위치 | 설명 |\n## 4. 구성               | 영역 | 역할 | AI 비중 | 주 작성자 |\n## 5. 가장 많이 바뀐 곳  | 영역 | 변경 횟수 | 관련 PR · 이유 |\n## 6. 관리 포인트        [높음] 작성자 1명 · AI 비중 높은데 이해 확인 1명뿐 · 손으로 갱신하는 설정 / [보통] 테스트 없는 영역 · 외부 패키지 · 이해 확인 병합 뒤 작성 남은 긴급 PR\n## 7. 주요 결정          | 결정 | 이유 | 출처 (PR · 결정 기록) |\n## 8. 미해결 메모 · 확인 필요 질문  | 내용 | 출처 |\n## 9. 인계 체크리스트    - [ ] 빌드 · 테스트 실행 - [ ] 관리 포인트 영역 코드 읽기 - [ ] 핵심 기능 1회 실행 - [ ] 계정 · 권한 이전\n-->\n# 점검관리 툴 인수인계 (기준선, 2026-11-02)\n\n출처 표시: (기준선 분석) git 통계 · 커밋에서 확인 / (담당자 보완) 현 담당 답 원문 / (확인 필요) 기록 없음\n\n## 1. 한눈 요약\n| 항목 | 내용 |\n|---|---|\n| 무엇 | 현장 장비 점검 · 설정 · 펌웨어 업데이트 도구 (README · 기준선 분석) |\n| 환경 | Dart (pubspec.yaml · 기준선 분석) |\n| 규모 | 커밋 10개 · 태그 v1.0.0 ~ v1.2.0 · 테스트 3건 (기준선 분석) |\n| 담당 | 개발자A (현 담당) · 개발자C (퇴사, 최근 6개월 커밋 없음) |\n\n## 2. 실행 방법\n- dart pub get → dart test (3건)\n- 서버 연동: 토큰은 환경변수 (v1.1.0 이후, 변수 이름은 확인 필요)\n\n## 3. 주요 기능과 위치\n| 기능 | 위치 | 설명 |\n|---|---|---|\n| 펌웨어 업데이트 | lib/fwupdate/ | 재시도 3회 · 진행률 · 파일 검증 (기준선 분석) |\n| 점검 로그 | lib/log/ | 보관 30일 · 최신순 조회 (기준선 분석) |\n| 장치 이름 변경 | lib/device/ | 화면 (기준선 분석) |\n\n## 4. 구성\n| 영역 | 역할 | AI 비중 | 주 작성자 |\n|---|---|---|---|\n| lib/fwupdate/ | 업데이트 | 기록 없음 | 개발자C 75% · 개발자A 25% |\n| lib/log/ | 로그 | 기록 없음 | 개발자C 50% · 개발자A 50% |\n| lib/device/ | 장치 이름 | 기록 없음 | 개발자A |\n\n## 5. 가장 많이 바뀐 곳\n| 영역 | 변경 횟수 | 관련 커밋 |\n|---|---|---|\n| lib/fwupdate/ | 4 | 재시도 3회 · 진행률 · 파일 검증 · 오류 메시지 |\n| lib/log/ | 2 | 보관 30일 · 최신순 조회 |\n| lib/config.dart | 2 | 서버 연동 설정 · 토큰 이동 |\n\n## 6. 관리 포인트\n- [높음] 이력 속 비밀정보 1건 — 커밋 85c1ea3 lib/config.dart (값 가림). 이력은 지우지 않고 토큰 교체 필요 (기준선 분석)\n- [높음] lib/fwupdate/ — 주 작성자 개발자C 퇴사(최근 6개월 커밋 없음), 가장 자주 바뀐 곳 (기준선 분석)\n- [보통] 테스트 3건뿐, 재시도 · 진행률 · 파일 검증은 테스트 없음 (기준선 분석)\n\n## 7. 주요 결정\n| 결정 | 이유 | 출처 |\n|---|---|---|\n| 펌웨어 업데이트 재시도 3회 | 현장 통신이 자주 끊겨 3회까지 재시도로 정함 (개발자C와 협의) | 담당자 보완 |\n\n## 8. 미해결 메모 · 확인 필요 질문\n| 내용 | 출처 |\n|---|---|\n| 로그 보관 30일의 근거 | 확인 필요 (담당자 모름) |\n| 서버 토큰 환경변수 이름 · 설정 위치 | 확인 필요 |\n\n## 9. 인계 체크리스트\n- [ ] 서버 토큰 교체 여부 확인 (정보보호 담당)\n- [ ] dart test 3건 실행\n- [ ] lib/fwupdate/ 코드 읽기 (퇴사자 작성 비중 높음)\n"}, {"path": "docs/HISTORY.md", "status": "A", "before": null, "after": "<!--\n히스토리 문서 형식 (/hdel-ai-coding:병합요청 · /hdel-ai-coding:병합긴급 이 PR마다 같은 브랜치에서 추가, 개발자 확인)\n- 최신 항목이 위. 제목 바로 아래에 추가한다. 버전은 git 태그로 관리한다\n- PR 본문에서 옮겨 적는다. PR에 없는 내용을 새로 만들지 않는다. 이유를 모르면 \"확인 필요\"\n- 유형: 기능 · 수정 · 긴급 · 보안 · 리팩터링 · 문서\n\n## [유형] <PR 제목> (#번호) · YYYY-MM-DD\n- 담당: <개발자> · AI: <도구 / 정도> · 위험도: <낮음 · 보통 · 높음>\n- 내용과 이유: <무엇을 왜, 관련 이슈>\n- 개발자 설명: <이해 확인의 핵심 로직 · 우려되는 문제점 요약>\n- 바뀐 곳: <폴더 · 주요 파일>\n- 확인 필요 항목: <새 패키지 등과 이유, 없으면 생략>\n- 되돌리는 방법: <위험도 보통 이상일 때>\n- 인계 메모: <다음 사람이 알아야 할 것>\n- 이해 확인: 병합 뒤 작성 (/hdel-ai-coding:병합긴급 일 때만)\n-->\n# 점검관리 툴 히스토리\n\n## 기준선 (2026-11-02 까지 · 커밋 10개 · 태그 v1.0.0 ~ v1.2.0)\n기존 커밋 · 태그에서 확인되는 것만 옮겼습니다. 유형은 (추정), 이유가 기록에 없으면 \"확인 필요\"입니다. 이후 PR 항목은 이 위에 쌓입니다.\n\n### v1.2.0 (2026-03-03)\n- [수정 (추정)] fwupdate 오류 메시지 수정 · 개발자A · 이유: 확인 필요\n- [기능 (추정)] 로그 조회 정렬 · 개발자A · 이유: 확인 필요\n- [기능 (추정)] 펌웨어 파일 검증 · 개발자C · 이유: 확인 필요\n\n### v1.1.0 (2025-08-11)\n- [보안 (추정)] 서버 토큰 환경변수로 이동 · 개발자C · 이유: 확인 필요 (이력 속 비밀정보와 관련)\n- [기능 (추정)] 장치 이름 변경 화면 · 개발자A · 이유: 확인 필요\n- [기능 (추정)] 업데이트 진행률 표시 · 개발자C · 이유: 확인 필요\n\n### v1.0.0 (2025-04-10)\n- [기능 (추정)] 로그 보관 30일 · 개발자C · 이유: 확인 필요\n- [기능 (추정)] 서버 연동 설정 추가 · 개발자C · 이유: 확인 필요\n- [기능 (추정)] 펌웨어 업데이트 재시도 3회 · 개발자C · 이유: 현장 통신이 자주 끊겨 3회까지 재시도로 정함 (담당자 보완)\n"}]}]}, {"files": {".claude-plugin/plugin.json": "{\n  \"name\": \"hdel-ai-coding\",\n  \"version\": \"1.0.0\",\n  \"description\": \"AI 코딩 관리체계: 프로젝트 적용(신규 · 유지보수), 병합 요청 · 긴급 · 인수인계 명령, 이해 확인 검사, 규칙 문서 묶음\",\n  \"author\": {\n    \"name\": \"개발 리더\"\n  }\n}", "commands/병합요청.md": "---\ndescription: PR 본문 · 히스토리 · 인수인계를 작성하고, 개발자 이해 확인과 최종 확인을 받아 PR 생성 · 병합까지 한다\ndisable-model-invocation: true\n---\n현재 브랜치와 main의 차이를 읽고 아래를 순서대로 진행한다. 기록 문서 경로는 AGENTS.md \"기록 위치\" 표를 따른다.\n\n1. 바뀐 파일 목록과 각 파일의 AI 기여(AI 생성 / AI 생성 후 수정 / 직접 작성)를 정리한다\n   - 커밋의 Co-Authored-By 표시와 이번 작업 대화를 근거로 한다\n2. PR 본문: .github/pull_request_template.md 형식으로 채워 .git/PR_BODY.md 에 저장한다\n   - 변경 내용 (요약) · 변경 이유 · 목적: 연결된 이슈 · 작업 대화에서. 이유를 모르면 \"확인 필요\"\n   - 테스트: 실제로 실행한 테스트 명령(AGENTS.md)과 결과만\n   - 확인 필요 항목: 테스트 삭제 · 건너뛰기, CI 설정 변경, 새 패키지, 변경 규모(파일 10개 · 500줄 초과)\n   - 위험도 · 되돌리는 방법: 바뀐 범위를 보고 제안\n   - \"개발자 이해 확인\" 칸은 비워 둔다. AI는 이 칸의 답을 지어내지 않는다\n3. 히스토리 문서: 제목 바로 아래(최신이 위)에 이번 변경 항목을 파일 맨 위 주석의 형식대로 추가한다\n4. 인수인계 문서: 이번 변경으로 달라진 부분만 고친다 (주요 기능 · 구성 · 가장 많이 바뀐 곳 · 관리 포인트 · 주요 결정 · 미해결 메모). 맨 위 기준을 \"PR #<번호> 기준, 날짜\"로 바꾼다\n   - 관리 포인트에 \"#<번호> 긴급 · 이해 확인 병합 뒤 작성\"이 있으면 그 PR 본문에 이해 확인이 채워졌는지 본다. 채워졌으면 지우고, 비어 있으면 개발자에게 그 PR의 이해 확인도 지금 쓸지 묻는다\n5. (선택) 구조를 바꾸는 변경이면 결정 기록을 남길지 묻고, 원하면 결정 기록 폴더에 NNNN-제목.md 를 추가한다\n6. 대화에서 \"개발자 이해 확인\"을 한 문항씩 묻는다 (AGENTS.md \"조직: 비개발\"이면 \"어떻게 확인했나\" 1문항). 예시 답을 제시하지 않는다\n   - 한 문항을 묻고 답을 받으면, 고치거나 요약하지 말고 원문 그대로 해당 칸에 넣은 뒤 다음 문항을 묻는다\n7. 최종 확인: 완성된 PR 본문(이해 확인 포함) · 히스토리 항목 · 인수인계 변경을 한 번에 보여 주고 \"이대로 PR을 올리고 병합할까요?\"라고 묻는다\n   - 고칠 곳을 말하면 고친 뒤 다시 묻는다. \"예\"라고 답한 뒤에만 다음으로 간다\n8. 기록 파일을 커밋 · 푸시하고 `gh pr create --title \"<제목>\" --body-file .git/PR_BODY.md` 로 PR을 만든다\n   - 이해 확인이 비어 있으면 PR 생성이 막힌다 (플러그인의 이해 확인 검사 훅). 막히면 빠진 문항을 다시 묻는다\n9. 자동 검사(.github/workflows/)가 있으면 `gh pr checks --watch` 로 끝날 때까지 기다린다. 실패하면 병합하지 않고 실패 항목을 알린다\n10. PR 본문에서 주석(<!-- -->) 줄을 뺀 내용을 .git/MERGE_BODY.md 로 만들고 `gh pr merge --squash --delete-branch --body-file .git/MERGE_BODY.md` 로 병합한다. PR 본문(이해 확인 포함)이 병합 커밋 메시지로 들어가 git 이력에도 남는다\n11. main 을 최신으로 받은 뒤, PR 주소와 병합 결과를 알린다\n", "commands/병합긴급.md": "---\ndescription: 긴급 수정용. /hdel-ai-coding:병합요청 과 같고, 먼저 병합한 뒤 이해 확인을 받는다\ndisable-model-invocation: true\n---\n/hdel-ai-coding:병합요청 과 같은 순서로 진행하되 아래만 다르게 한다.\n\n1. PR 제목 앞에 \"[긴급]\"을 붙이고, PR 본문 \"변경 유형\"은 \"긴급\"으로 쓴다\n2. 히스토리 항목 유형은 [긴급]으로 쓰고 항목 끝에 \"- 이해 확인: 병합 뒤 작성\"을 붙인다. 인수인계 관리 포인트에 \"#<PR 번호> 긴급 · 이해 확인 병합 뒤 작성\"을 추가한다\n3. 이해 확인은 병합 전에 묻지 않는다. 최종 확인(\"이대로 PR을 올리고 병합할까요?\")을 받으면 PR 생성 · 병합까지 바로 한다\n4. 병합이 끝나면 이어서 이해 확인을 한 문항씩 묻고, 답을 원문 그대로 `gh pr edit <번호> --body-file .git/PR_BODY.md` 로 PR 본문에 넣는다\n   - 병합 커밋 메시지에는 병합 시점의 본문(이해 확인 없음)이 남는다. 나중에 쓴 이해 확인은 PR 본문과 다음 /hdel-ai-coding:병합요청 의 인수인계 갱신으로 남는다\n   - 개발자가 지금 답하지 않으면 그대로 두고 끝낸다. 다음 /hdel-ai-coding:병합요청 때 인수인계 관리 포인트를 보고 다시 묻는다\n", "commands/신규적용.md": "---\ndescription: 규칙 문서 묶음을 이 저장소에 배치하고 AGENTS.md 프로젝트 정보를 채운다\nargument-hint: [규칙 문서 묶음 폴더 — 없으면 플러그인에 든 묶음]\ndisable-model-invocation: true\n---\n(담당 개발자가 자기 프로젝트에서 실행한다. 규칙 문서는 저장소에 들어가 팀 모두가 받는다)\n규칙 문서 묶음: $ARGUMENTS 가 있으면 그 폴더, 없으면 이 플러그인에 든 ${CLAUDE_PLUGIN_ROOT}/rules 를 쓴다. 적용한 묶음 버전(${CLAUDE_PLUGIN_ROOT}/.claude-plugin/plugin.json 의 version)을 커밋 메시지와 AGENTS.md 에 적는다.\n규칙 문서 묶음을 현재 저장소 최상위에 배치한다. 묶음 안의 경로가 곧 저장소 안의 경로다 (예: <묶음>/.github/pull_request_template.md → .github/pull_request_template.md). 위치를 새로 정하지 않는다.\n\n1. 묶음의 파일 목록을 만들고, 저장소에 같은 경로의 파일이 있으면 \"겹침\"으로 분류한다.\n2. 겹치지 않는 파일은 같은 경로로 복사한다. 폴더가 없으면 만든다. 겹치는 파일은 덮어쓰지 않는다.\n3. 겹친 파일마다 차이를 보여 주고 개발자에게 묻는다: (가) 기존 유지 (나) 묶음으로 교체 (다) 합치기.\n   - 기록 문서(히스토리 · 인수인계 · 사용 지침)와 같은 이름의 파일이 다른 용도로 이미 있으면, 기록 위치를 docs/ai-coding/ 로 바꾸자고 제안한다. 바꾸면 그 위치에 복사하고 AGENTS.md \"기록 위치\" 표를 고친다.\n4. 저장소를 읽어 AGENTS.md 의 <꺾쇠> 자리를 채운 초안을 만든다.\n   - 프로젝트 개요(README · 패키지 설명), 빌드 · 테스트 명령(패키지 파일 · 스크립트), 폴더 구조(최상위 · 주요 폴더 역할), 코드 규칙(설정 파일 위치 등)\n   - 근거가 없는 것은 지어내지 않고 \"확인 필요\"로 남긴다\n5. 자동 검사 파일(.github/workflows/governance-check.yml)이 있으면, 저장소 언어에 맞게 맨 위 env 의 탐지 규칙을 docs/확인필요항목_기준.md \"언어별 기본값\"에서 골라 바꾼다.\n6. 배치한 파일 · 겹침 처리 결과 · AGENTS.md 초안을 보여 주고 확인을 받은 뒤 \"착수: 규칙 문서 배치\"로 커밋한다.\n", "commands/유지보수적용.md": "---\ndescription: 기존 프로젝트에 관리체계를 적용한다. 기준선(비밀정보 검사 · 분석 · 기준 히스토리 · 인수인계 초안 · 담당자 보완)을 만든 뒤 규칙 문서를 배치하고 PR · 병합한다\nargument-hint: [규칙 문서 묶음 폴더 — 없으면 플러그인에 든 묶음]\ndisable-model-invocation: true\n---\n(담당 개발자가 자기 프로젝트에서 실행한다. 규칙 문서는 저장소에 들어가 팀 모두가 받는다)\n규칙 문서 묶음: $ARGUMENTS 가 있으면 그 폴더, 없으면 이 플러그인에 든 ${CLAUDE_PLUGIN_ROOT}/rules 를 쓴다. 적용한 묶음 버전(${CLAUDE_PLUGIN_ROOT}/.claude-plugin/plugin.json 의 version)을 커밋 메시지와 AGENTS.md 에 적는다.\n이미 개발 · 운영 중인 저장소에 규칙 문서 묶음을 적용한다. 기존 이력에서 확인되는 것만 채우고, 없는 정보는 지어내지 않고 \"확인 필요\"로 둔다. 브랜치 baseline/ai-coding 에서 작업한다.\n\n1. 비밀정보 이력 검사: git 이력 전체를 한 번 검사한다 (gitleaks 가 있으면 `gitleaks git --redact`, 없으면 git log -p 에서 키 · 토큰 · 비밀번호 패턴을 찾는다)\n   - 발견하면 값은 가리고 위치(커밋 · 파일)만 보여 준다. 이력을 지우지 말고 키 교체부터 하도록 안내하고, 인수인계 관리 포인트에 [높음]으로 남긴다\n2. 저장소 분석: 통계는 git 명령으로 뽑는다 (폴더별 변경 횟수 · 주 작성자 · 최근 활동 · 태그 · 최근 6개월에 커밋이 없는 작성자의 비중). AI 요약은 가장 많이 바뀐 폴더 2 ~ 3곳에만 쓴다\n   - 분석 결과를 짧게 보여 준다\n3. 초안 생성 (기록 문서 형식은 묶음의 docs/HISTORY.md · docs/HANDOVER.md 맨 위 주석)\n   - 기준 히스토리: \"## 기준선 (YYYY-MM-DD 까지 · 커밋 N개 · 태그 …)\" 아래에 최근 태그 3개 구간만 커밋 메시지에서 옮겨 적는다. 유형은 \"(추정)\", 이유가 없으면 \"확인 필요\"\n   - 인수인계 초안: 9개 절을 저장소 분석으로 채우고, 출처에 \"기준선 분석\"을 붙인다. 모르는 이유는 8절 \"확인 필요 질문\"으로 옮긴다\n4. 담당자 보완: 가장 많이 바뀐 폴더에 대한 \"확인 필요 질문\"만 한 문항씩 묻는다 (최대 5개). 답은 원문 그대로 넣고, \"모름\"이면 확인 필요로 남긴다. 전체를 검수하지는 않는다\n5. 규칙 문서 배치: /hdel-ai-coding:신규적용 의 1 ~ 5단계와 같다 (경로 그대로 복사 · 겹치면 묻기 · AGENTS.md <꺾쇠> 채우기 · 검사 탐지 규칙 고르기). 단, 기록 문서(HISTORY · HANDOVER)는 3 · 4단계에서 만든 것을 쓴다\n6. 최종 확인: 비밀정보 검사 결과 · 기준 히스토리 · 인수인계 초안 · 배치 파일을 보여 주고 \"이대로 PR을 올리고 병합할까요?\"라고 묻는다. \"예\"라고 하면 커밋 · 푸시하고 제목 \"[기준선] AI 코딩 관리체계 적용\" 으로 PR을 만들어 병합한다\n7. 이후에는 신규 프로젝트와 같이 /hdel-ai-coding:병합요청 이 같은 문서에 이어서 쓴다고 안내한다\n", "commands/인수인계.md": "---\ndescription: 인수인계 문서 전체와 최근 히스토리를 한 번에 보여 준다 (파일은 고치지 않음)\n---\nAGENTS.md \"기록 위치\"의 인수인계 문서와 히스토리 문서를 읽고, 고치지 않고 아래 순서로 보여 준다. 처음 보는 사람이 이것만 읽고 프로젝트를 파악할 수 있게, 인수인계 문서의 9개 절을 빠짐없이 보여 준다 (표는 표로, 출처 표시는 그대로).\n\n1. 기준 — \"PR #<번호> 기준, 날짜\" (기준선이면 \"기준선\")\n2. 어떤 프로젝트인가 — 1절 한눈 요약 (무엇 · 환경 · 규모 · 담당)\n3. 실행 방법 — 2절\n4. 주요 기능과 위치 · 구성 — 3 · 4절 (AI 비중 · 주 작성자 포함)\n5. 히스토리 — 히스토리 문서의 최근 항목 5개를 \"[유형] 제목 (#번호) · 날짜 · 담당 · 한 줄 이유\"로. 기준선 구간이 있으면 마지막에 \"기준선: 커밋 N개 · 태그 …\" 한 줄\n6. 가장 많이 바뀐 곳 — 5절\n7. 관리 포인트 — 6절, [높음] 먼저\n8. 주요 결정 — 7절 (결정 기록 파일이 있으면 파일 이름도)\n9. 미해결 메모 · 확인 필요 질문 — 8절\n10. 인계 체크리스트 — 9절\n\n$ARGUMENTS 가 있으면 (예: 폴더 이름 · 기능 · \"lib/fwupdate\") 위 순서 중 그 내용에 관련된 부분만 골라 보여 주고, 근거로 히스토리 문서의 해당 항목과 결정 기록을 함께 인용한다.\n", "hooks/hooks.json": "{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"node \\\"${CLAUDE_PLUGIN_ROOT}/hooks/understand-check.js\\\"\", \"timeout\": 30 }\n        ]\n      }\n    ]\n  }\n}\n", "hooks/understand-check.js": "#!/usr/bin/env node\n// 병합 요청(PR)을 올리기 직전에 \"개발자 이해 확인\"이 채워졌는지 확인한다. 비어 있으면 PR을 올리지 않는다 (종료 코드 2).\n// - AI 도구가 `gh pr create --body-file <파일>` 을 실행하려 할 때 동작 (Claude Code PreToolUse · Gemini CLI BeforeTool 공용)\n// - 답은 /hdel-ai-coding:병합요청 이 대화에서 개발자에게 받아 원문 그대로 넣는다. 이 스크립트는 빈칸만 막는다\n// - 건너뜀: AI 미사용 PR, 제목이 [긴급](병합 뒤 작성) · [기준선](유지보수 적용, 담당자 보완으로 대신) 인 PR\n// - AGENTS.md 에 \"조직: 비개발\" 이 있으면 1문항(어떻게 확인했나)\nconst fs = require(\"fs\"), path = require(\"path\");\n\nlet input = {};\ntry { input = JSON.parse(fs.readFileSync(0, \"utf8\")); } catch { process.exit(0); }\nconst cmd = (input.tool_input && input.tool_input.command) || \"\";\nif (!/\\bgh\\s+pr\\s+create\\b/.test(cmd)) process.exit(0);\n\nconst block = msg => { process.stderr.write(msg + \"\\n\"); process.exit(2); };\nconst root = process.env.CLAUDE_PROJECT_DIR || process.env.GEMINI_PROJECT_DIR || input.cwd || process.cwd();\nconst fileArg = cmd.match(/--body-file[=\\s]+(?:\"([^\"]+)\"|'([^']+)'|(\\S+))/);\nif (!fileArg) block(\"PR 본문은 --body-file 로 올립니다. /hdel-ai-coding:병합요청 으로 PR을 만드세요.\");\nconst base = input.tool_input.dir_path ? path.resolve(root, input.tool_input.dir_path) : (input.cwd || root);  // Gemini run_shell_command 의 실행 폴더\nconst bodyFile = path.resolve(base, fileArg[1] || fileArg[2] || fileArg[3]);\nif (!fs.existsSync(bodyFile)) block(`PR 본문 파일이 없습니다: ${bodyFile}`);\nconst body = fs.readFileSync(bodyFile, \"utf8\");\nconst title = (cmd.match(/--title[=\\s]+(?:\"([^\"]*)\"|'([^']*)')/) || [])[1] || \"\";\nif (/^\\[(긴급|기준선)\\]/.test(title) || !/\\[x\\] 사용함/.test(body)) process.exit(0);\n\nconst agentsPath = path.join(root, \"AGENTS.md\");\nconst nonDev = fs.existsSync(agentsPath) && /조직:\\s*비개발/.test(fs.readFileSync(agentsPath, \"utf8\"));\nconst QS = nonDev ? [\"어떻게 확인했나\"] : [\"핵심 로직은 어떻게 동작하는가\", \"우려되는 문제점은 무엇인가\", \"왜 이 방식을 골랐는가 (검토한 대안)\"];\nconst empty = QS.filter(q => { const m = body.match(new RegExp(`^- ${q.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\")}:(.*)$`, \"m\")); return !m || !m[1].trim(); });\nif (empty.length) block(`개발자 이해 확인이 비어 있어 PR을 올리지 않았습니다: ${empty.join(\" / \")}\\n개발자에게 이 문항을 물어, 받은 답을 고치지 말고 그대로 PR 본문에 넣은 뒤 다시 올리세요. 긴급이면 /hdel-ai-coding:병합긴급 을 쓰세요.`);\nprocess.exit(0);\n"}, "rules": ["rules/.claude/settings.json", "rules/.github/pull_request_template.md", "rules/AGENTS.md", "rules/CLAUDE.md", "rules/GEMINI.md", "rules/docs/AI_코딩_사용지침.md", "rules/docs/HANDOVER.md", "rules/docs/HISTORY.md"], "gemini": ["gemini-extension/commands/hdel-ai-coding/병합긴급.toml", "gemini-extension/commands/hdel-ai-coding/병합요청.toml", "gemini-extension/commands/hdel-ai-coding/신규적용.toml", "gemini-extension/commands/hdel-ai-coding/유지보수적용.toml", "gemini-extension/commands/hdel-ai-coding/인수인계.toml", "gemini-extension/gemini-extension.json", "gemini-extension/hooks/hooks.json", "gemini-extension/hooks/understand-check.js", "gemini-extension/rules/.claude/settings.json", "gemini-extension/rules/.github/pull_request_template.md", "gemini-extension/rules/AGENTS.md", "gemini-extension/rules/CLAUDE.md", "gemini-extension/rules/GEMINI.md", "gemini-extension/rules/docs/AI_코딩_사용지침.md", "gemini-extension/rules/docs/HANDOVER.md", "gemini-extension/rules/docs/HISTORY.md"]}]</script>
<script>

const S3 = ["착수", "개발", "커밋 · 테스트", "병합 요청", "자동 검사", "병합", "기록 · 인계"];
const P1 = "1쪽 · 문서 기반 관리", P2 = "2쪽 · 문서 기반 관리 예시", P3 = "3쪽 · 사이트 기반 관리로 확장";
const AI = "Co-Authored-By: Claude <noreply@anthropic.com>";
// 단계 정의: c = 그 단계 끝의 커밋(트리 상태), only = 이 단계에서 표시할 바뀐 파일, chat = Claude 창 진행

function diff(a, b) {

}

  $("tabs").innerHTML = keys.map(k => `<button data-pf="${esc(k)}" class="${k === sel ? "on" : ""}">${esc(k.replace(/\.md$/, "").replace("commands/", "/hdel-ai-coding:"))}</button>`).join("");
  $("vtitle").innerHTML = `플러그인 hdel-ai-coding<span class="sub">개인 환경 · ~/.claude/plugins/</span>`;
  $("view").innerHTML = `<div class="vh"><span class="p">${esc(sel)}</span><span class="badge b-mod">플러그인 안</span></div>` + codeView({path: sel, after: PLUG.files[sel]}, true) +
    `<div class="note">함께 든 규칙 문서 묶음 (적용 명령이 프로젝트로 복사): ${PLUG.rules.map(esc).join(" · ")}<br>Gemini CLI 는 같은 내용의 확장(gemini-extension/)을 설치: 명령 ${PLUG.gemini.filter(x => x.includes("/commands/")).length}개 · 같은 검사 훅</div>`;
}
function showResult(s) {  // 병합 후 남는 기록
  const c = R[s.c];
  $("tabs").hidden = true;
  $("vtitle").innerHTML = `병합 후 남는 기록<span class="sub">main · ${esc(c.sha)}</span>`;
  const msg = esc(c.message).replace(/(### 개발자 이해 확인[\s\S]*?)(?=\n## |$)/, '<span style="background:var(--revs);display:block">$1</span>');
  const where = [["코드", c.files.filter(f => !f.path.startsWith("docs/")).map(f => f.path).join(" · "), "main (git)"],
    ["히스토리 항목", "docs/HISTORY.md", "main (git)"], ["인수인계 갱신", "docs/HANDOVER.md", "main (git)"],
    ["PR 본문 (이해 확인 포함)", "병합 커밋 메시지 · GitHub PR", "main (git) + GitHub"], ["AI 사용 표시", "커밋 메시지 Co-Authored-By", "main (git)"]];
  $("view").innerHTML = `<div style="padding:12px"><table><tr><th>기록</th><th>무엇</th><th>남는 곳</th></tr>${where.map(r => `<tr><td><b>${r[0]}</b></td><td class="mono">${esc(r[1])}</td><td>${r[2]}</td></tr>`).join("")}</table>
    <div class="commit" style="margin:12px 0 0"><div class="hd"><span class="state m">Merged</span>병합 커밋 메시지 = PR 본문<span style="margin-left:auto;font-weight:400;color:var(--muted)">git log 로 언제든 확인</span></div><pre style="max-height:420px;overflow:auto">${msg}</pre></div></div>`;
}
function showLog(s) {  // 기존 저장소 git 이력 (기준선 분석 대상)
  $("tabs").hidden = true;
  $("vtitle").innerHTML = `git 이력 · 커밋 ${s.c + 1}개<span class="sub">기존 프로젝트</span>`;
  const rows = R.slice(0, s.c + 1).reverse().map(c => {
    const hot = (s.hl || []).some(h => c.subject.includes(h)), gone = (s.gone || []).includes(c.author);
    return `<tr${hot ? ' style="background:var(--bads)"' : ""}><td class="mono">${esc(c.sha)}</td><td class="mono">${esc(c.date)}</td><td${gone ? ' style="color:var(--rev);font-weight:600"' : ""}>${esc(c.author)}${gone ? " (퇴사)" : ""}</td><td>${esc(c.subject)}${c.tags.length ? ` <span class="badge b-mod">${c.tags.map(esc).join(" ")}</span>` : ""}${hot ? ' <span class="badge" style="background:var(--bads);color:var(--bad)">비밀정보 의심</span>' : ""}</td><td class="mono">${c.files.map(f => esc(f.path.split("/").slice(-2).join("/"))).join(" · ")}</td></tr>`; }).join("");
  $("view").innerHTML = `<div style="padding:10px 12px"><table class="log"><tr><th>커밋</th><th>날짜</th><th>작성자</th><th>메시지 · 태그</th><th>바뀐 파일</th></tr>${rows}</table>
    <div class="note">커밋 메시지에 이유가 거의 없고, AI 사용 표시 · PR 기록도 없습니다. 기준선은 이 이력에서 확인되는 것만 채웁니다.</div></div>`;
}
function showImg(s) {
  $("tabs").hidden = true;
  const [id, t] = s.imgs[Math.min(imgSel, s.imgs.length - 1)];
  $("vtitle").innerHTML = `사이트 화면<span class="sub">${esc(t)}</span>`;
  $("view").innerHTML = `<div class="itabs">${s.imgs.map((x, i) => `<button data-im="${i}" class="${x[0] === id ? "on" : ""}">${esc(x[1])}</button>`).join("")}</div><div class="img"><img src="img/poc/${id}.jpg" alt="${esc(t)}"></div>`;
}

// ── Claude 창
function toolHtml(m) { return `<div class="tool pop"><b>${m.t}</b><span class="p">${esc(m.p)}</span><span class="r ${m.ok ? "ok" : /^\+/.test(m.r) ? "add" : ""}">${esc(m.r)}</span></div>`; }
async function playChat(s, my, onFile) {
  const box = $("msgs"); box.innerHTML = "";
  for (const m of s.chat) {
    if (my !== run) return;
    if (m.u) {
      $("phd").hidden = true;
      if (m.u.startsWith("/")) {
        $("slash").hidden = false;
        $("slash").innerHTML = [["/hdel-ai-coding:신규적용", "새 프로젝트: 규칙 문서를 경로 그대로 배치하고 AGENTS.md 를 채운다"], ["/hdel-ai-coding:유지보수적용", "기존 프로젝트: 기준선(비밀정보 검사 · 분석 · 초안 · 담당자 보완) 후 배치"], ["/hdel-ai-coding:병합요청", "PR 본문 · 히스토리 · 인수인계 작성 → 이해 확인 → 최종 확인 → 병합"], ["/hdel-ai-coding:병합긴급", "긴급 수정: 먼저 병합하고 이해 확인은 병합 뒤"], ["/hdel-ai-coding:인수인계", "인수인계 내용 요약 보기 (파일은 고치지 않음)"]].map(([c, d]) => `<div class="${c === m.u ? "on" : ""}"><b>${c}</b>${d}</div>`).join("");
      }
      for (let k = 0; k <= m.u.length; k++) { if (my !== run) return; $("typed").textContent = m.u.slice(0, k); await sleep(m.u.startsWith("/") ? 90 : 38); }
      await sleep(350); $("slash").hidden = true; $("typed").textContent = ""; $("phd").hidden = false;
      box.insertAdjacentHTML("beforeend", `<div class="mu pop">${m.att ? `<div class="att">${m.att.map(a => `<span class="chip att">${esc(a)}</span>`).join("")}</div>` : ""}${esc(m.u)}</div>`);
    } else if (m.t) {
      await sleep(420); if (my !== run) return;
      box.insertAdjacentHTML("beforeend", toolHtml(m));
      if (m.f) onFile(m.f);
      if (m.all) onFile("*");
    } else if (m.a) {
      await sleep(500); if (my !== run) return;
      box.insertAdjacentHTML("beforeend", `<div class="ma pop">${esc(m.a)}${m.att ? `<div class="att" style="margin-top:6px;display:flex;gap:6px">${m.att.map(a => `<span class="chip att">${esc(a)}</span>`).join("")}</div>` : ""}</div>`);
    }
    box.scrollTop = box.scrollHeight;
  }
}

async function go(i) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i)); const my = ++run, s = STEPS[cur];
  R = s.repo === "L" ? L.commits : T.commits;  // 기존 프로젝트 장면은 별도 이력
  imgSel = 0; selFile = s.focus || null;
  $("part").textContent = s.part; $("title").textContent = s.title; $("desc").textContent = s.desc;
  $("say").innerHTML = `<small>말할 것</small>${esc(s.say)}`;
  $("chg").innerHTML = `<small>이번 단계에서 일어나는 변화</small>` + s.chg.map(([k, t]) => `<div><i class="k-${k}">${KIND[k]}</i><span>${esc(t.replace(/^[^:]+: /, ""))}</span></div>`).join("");
  const parts = [P1, P2, P3];
  $("dots").innerHTML = STEPS.map((x, k) => `<button data-go="${k}" class="${k <= cur ? "on" : ""} ${k && STEPS[k - 1].part !== x.part ? "p" : ""}" title="${esc(x.title)}"></button>`).join("");
  $("cnt").textContent = `${cur + 1} / ${STEPS.length}`;
  const stg = s.part === P3 ? S3 : S1;
  $("stages").innerHTML = stg.map((t, k) => `<span class="${k === s.st ? "on" : ""} ${s.part === P3 && k === 4 ? "new" : ""}">${t}</span>`).join("");
  $("where").textContent = s.part === P3 ? "사이트 기반 7단계" : "문서 기반 6단계";
  $("branch").textContent = s.branch || "";
  $("commit").textContent = R[s.c].sha;
  $("msgs").innerHTML = s.chat.length ? "" : `<div class="ma" style="color:#8a8475;margin:auto;text-align:center">${{log: "", result: "", plugin: "", pr: "이 단계는 GitHub PR 화면에서 진행합니다 →", commit: "", merge: "GitHub에서 병합합니다 →", play: "기록이 쌓이는 과정을 재생합니다 →", compare: "", site: "사이트 화면 →", img: "사이트 화면 →"}[s.view] ?? "오른쪽에서 파일 내용을 봅니다 →"}</div>`;
  $("typed").textContent = ""; $("slash").hidden = true;
  const fs = stepFiles(s);
  // 채팅에서 파일을 고치기 전에는 트리 표시를 미룬다
  const chatFiles = new Set(s.chat.filter(m => m.f).map(m => m.f));
  const early = s.chat.some(m => m.all) ? [] : fs.filter(f => !chatFiles.has(f.path));
  tree(s, s.chat.length ? early : fs);
  const v = s.view;
  if (v === "pr") showPR(s, my); else if (v === "commit") showCommit(s); else if (v === "merge") showMerge(s); else if (v === "play") showPlay(s, my);
  else if (v === "compare") showCompare(s, my); else if (v === "site") showSite(); else if (v === "img") showImg(s); else if (v === "log") showLog(s); else if (v === "result") showResult(s); else if (v === "plugin") showPlugin(s);
  else showFiles(s, s.chat.length ? (early.length ? early : []) : fs);
  if (s.chat.length) {
    const seen = [...early];
    await playChat(s, my, p => { if (my !== run) return; if (p === "*") { seen.splice(0, seen.length, ...fs); } else { const f = fs.find(x => x.path === p); if (!f) return; seen.push(f); selFile = p; } tree(s, seen); if (!v) showFiles(s, seen); });
    if (my !== run) return;
    selFile = s.focus || selFile; tree(s, fs); if (!v) showFiles(s, fs);
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-go],[data-f],[data-im],[data-pf],#prev,#next,#replay"); if (!b) return;
  if (b.dataset.pf) { selFile = b.dataset.pf; showPlugin(STEPS[cur]); return; }
  if (b.id === "prev") go(cur - 1); else if (b.id === "next") go(cur + 1); else if (b.id === "replay") go(cur);
  else if (b.dataset.go) go(+b.dataset.go);
  else if (b.dataset.im) { imgSel = +b.dataset.im; showImg(STEPS[cur]); }
  else if (b.dataset.f) { selFile = b.dataset.f; const s = STEPS[cur]; if (!s.view) { const fs = stepFiles(s); showFiles(s, fs.some(f => f.path === selFile) ? fs : [fileAt(s.c, selFile)].filter(Boolean)); tree(s, stepFiles(s)); } }
});
addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(cur + 1); } if (e.key === "ArrowLeft" || e.key === "PageUp") go(cur - 1); });
function fit() { $("slide").style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; }
addEventListener("resize", fit); fit();
const EMBED = document.getElementById("data");
(EMBED ? Promise.resolve(JSON.parse(EMBED.textContent)) : Promise.all(["tour", "demo", "site", "tour-extra"].map(n => fetch(`../scenario/snapshot/${n}.json`).then(r => r.json()))).then(([t, d, s, x]) => [t, d, s, ...x])).then(([t, d, s, l, pl]) => {
  T = t; DEMO = d; SITE = s; if (l) L = l; if (pl) PLUG = pl; R = T.commits; go(+(location.hash.slice(1) || 1) - 1);
});
addEventListener("hashchange", () => go(+(location.hash.slice(1) || 1) - 1));
</script>
</body></html>
