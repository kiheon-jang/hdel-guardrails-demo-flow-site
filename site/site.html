.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line)}.top b{font-size:16px}
.demo{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:3px}.meta{color:var(--muted);font-size:13px}
.sync{border:1px solid var(--line);padding:3px 10px;font-size:12.5px}.sync:hover{background:var(--soft)}
.tabs{margin-left:auto;display:flex;gap:4px}.tabs a{padding:4px 12px;font-size:13px;border:1px solid var(--line);color:var(--muted)}.tabs .on{background:var(--rec);border-color:var(--rec);color:#fff}
.stages{display:grid;grid-template-columns:repeat(7,1fr);background:var(--paper);border-bottom:1px solid var(--line)}
.st{padding:9px 12px;border-right:1px solid var(--line);font-size:13px}.st:last-child{border-right:0}.st .n{font-weight:700;display:flex;gap:6px;align-items:center}.st .n i{font-style:normal;color:var(--muted)}.st .d{color:var(--muted);font-size:12px}
.st:hover{background:var(--soft)}.st.on{background:var(--recs);box-shadow:inset 0 -3px 0 var(--rec)}
.tag{font-size:10px;font-weight:600;padding:0 5px;border-radius:2px}.k-강화{background:var(--devs);color:var(--dev)}.k-추가{background:var(--rec);color:#fff}.k-동일,.k-선택{background:var(--soft);color:var(--muted)}
.main{flex:1;overflow:auto;background:var(--paper)}
.say{border-bottom:1px solid var(--line);background:var(--recs);padding:10px 18px}.say b{margin-right:8px}
.two{display:grid;grid-template-columns:1fr 380px;min-height:100%}.two>div:first-child{border-right:1px solid var(--line)}
.pad{padding:14px 18px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{background:var(--soft);font-weight:600;font-size:12.5px;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}tr.sel td{background:var(--devs)}
.ok{color:var(--rec);font-weight:600}.no{color:var(--bad);font-weight:600}.wa{color:var(--rev);font-weight:600}.ref{color:var(--muted)}
.badge{font-size:11.5px;padding:2px 8px;border-radius:2px;font-weight:600;white-space:nowrap}.b-ok{background:var(--recs);color:var(--rec)}.b-no{background:var(--bads);color:var(--bad)}.b-mu{background:var(--soft);color:var(--muted)}
.ck{border:1px solid var(--line);margin-bottom:8px}.ck .h{display:flex;gap:8px;align-items:center;padding:7px 10px;font-weight:600;font-size:13px}.ck .c{padding:0 10px 8px 30px;font-size:12.5px;color:var(--muted)}
.att{font-size:12.5px;margin-top:12px}.att div{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.btn{display:inline-block;padding:5px 12px;font-size:13px;border:1px solid var(--line);margin-right:6px}.btn:hover{background:var(--soft)}
.mono{font-family:var(--mono);font-size:12px}
.note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);padding:8px 12px;margin-top:12px}
h4{margin:0 0 8px;font-size:14px}
.shots{padding:14px 18px}.sh-tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.sh-tabs button{border:1px solid var(--line);padding:3px 12px;font-size:12.5px}.sh-tabs .on{border-color:var(--rec);background:var(--recs)}
.shot{border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:1200px}.shot img{display:block;width:100%}
.cap{font-size:12.5px;color:var(--muted);margin:6px 0 0}.poc{font-size:11px;border:1px solid var(--line);padding:1px 6px;margin-right:6px;color:var(--muted)}
.sub{padding:4px 18px 0;font-weight:700;font-size:14px}
</style></head><body>
<div class="top"><b>점검관리 툴</b><span class="demo">시연용 test 프로젝트</span><span class="meta" id="meta"></span><button class="sync" id="sync">GitHub에서 다시 가져오기</button>
 <div class="tabs"><a href="./">① 문서 기반 보기</a><a class="on" href="site.html">② 사이트 기반 관리</a><a href="tour.html">▶ 발표 모드</a></div></div>
<div class="stages" id="stages"></div>
<div class="main" id="main"></div>
<script>
// 3쪽 "사이트 기반" 7단계 · 사이트가 하는 일
const STAGES = [
  {n: "착수", k: "강화", d: "규칙 문서 버전 · 배포", say: "규칙 문서를 버전으로 관리합니다. 배포는 묶음 폴더를 프로젝트에 그대로 복사하는 것이고, 프로젝트마다 적용 버전을 봅니다."},
  {n: "개발", k: "동일", d: "AI 규칙 문서대로", say: "문서 기반과 같습니다. AI가 CLAUDE.md → AGENTS.md 를 읽고 작업합니다. 사이트는 관여하지 않습니다."},
  {n: "커밋 · 테스트", k: "선택", d: "커밋 전 비밀정보 검사", say: "(선택) 개발자 PC의 커밋 전 검사. 이 시연에서는 PR 자동 검사의 비밀정보(gitleaks) 항목이 같은 역할을 합니다."},
  {n: "병합 요청", k: "강화", d: "파일 · AI 기여 자동 수집", say: "PR은 문서 기반과 같이 AI가 GitHub에 만듭니다. 사이트는 바뀐 파일(GitHub)과 파일별 AI 기여(PR 본문)를 모아 저장합니다."},
  {n: "자동 검사", k: "추가", d: "통과해야 병합", say: "PR이 열리거나 본문 · 커밋이 바뀔 때마다 GitHub Actions가 검사하고, 사이트가 결과를 가져와 저장합니다. 하나라도 실패하면 병합하지 않습니다."},
  {n: "병합", k: "강화", d: "검사 통과분만 · 태그", say: "검사를 통과한 PR만 병합합니다. 시연 저장소(GitHub 무료 · 비공개)는 버튼 차단 설정이 없어 절차로 지킵니다."},
  {n: "기록 · 인계", k: "강화", d: "자동 정리 · 조회", say: "사이트가 PR · 검사 · 히스토리를 모아 버전 · 담당 · AI 비중별로 보여 주고, 문서(.md)로 내려받습니다."},
];
// 단계별 PoC 화면 (scripts/seed_poc.py 데이터로 scripts/cap_poc.js 캡처)
const SHOTS = {
  0: [["p1-rules", "규칙 문서 버전 · 배포", "규칙 문서 묶음을 버전으로 관리하고, 프로젝트별 적용 현황 · 바뀐 내용을 보고 반영합니다. 파일 업로드 · 새 파일 추가는 정식 구축 때 추가할 기능입니다."],
      ["p1-edit", "규칙 문서 편집", "사이트에서 규칙 문서를 고치면 새 버전으로 저장되고 바뀐 이유가 변경 이력에 남습니다."],
      ["p1-new", "프로젝트 만들기", "새 저장소를 만들면 규칙 문서가 첫 커밋으로 자동 배치됩니다. 기존 저장소 연결(없는 규칙 문서를 PR로 자동 추가)은 정식 구축 때 추가할 기능입니다."],
      ["p1-project", "프로젝트 설정", "프로젝트 이름 · 멤버 · 저장소를 관리합니다."]],
  3: [["p4-form", "입력 화면 = PR 템플릿", "PR 템플릿과 같은 항목의 입력 화면. 오른쪽에 아직 비어 있는 필수 항목이 바로 보입니다."],
      ["p4-files", "바뀐 파일 · AI 기여", "브랜치를 고르면 바뀐 파일을 가져오고 파일별 AI 기여(AI 생성 · AI 생성 후 수정 · 직접 작성)를 표시합니다."]],
  4: [["p5-detail", "병합 요청 상세 · 검사", "확인 필요 항목(새 패키지)과 설명, 개발자 이해 확인, 병합 가능 여부를 한 화면에서 봅니다."]],
  5: [["p6-timeline", "병합 · 타임라인", "검사를 통과한 커밋만 병합하고, 등록 → 이해 확인 → 병합까지 이력과 버전(v0.1.0)이 남습니다."]],
  6: [["p7-history", "버전 이력", "병합한 변경이 버전 아래 자동으로 묶이고 문서(.md)로 내보냅니다."], ["p7-ai", "AI 작성 코드 현황", "폴더별 · 버전별 AI 비중을 자동으로 정리합니다."],
      ["p7-handover", "인수인계", "단독 담당 · AI 비중 높은 폴더를 우선순위로 정리하고 체크리스트 · 문서를 만듭니다."], ["p7-decisions", "결정 기록", "구조 변경 PR의 결정 기록 문서를 모아 봅니다."]],
};
const POC_NOTE = "기존 PoC 화면을 시연 데이터(점검관리 툴)로 찍고 문서 기준(리뷰 · 승인 없음, 규칙 문서 · 결정 기록 용어)에 맞게 표시를 조정했습니다";
let shotSel = 0;
const ITEMS = [["required", "필수 항목"], ["understand", "이해 확인"], ["signals", "위험 신호 설명"], ["secrets", "비밀정보"], ["tests", "테스트"]];
let D, stage = 4, prSel = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));

const runsOf = pr => D.checks.filter(c => c.headBranch === pr.headRefName && c.result);  // 최신이 앞
const lastRun = pr => runsOf(pr)[0];
function stages() {
  $("stages").innerHTML = STAGES.map((s, i) => `<button class="st${i === stage ? " on" : ""}" data-i="${i}"><div class="n"><i>${i + 1}</i>${s.n}<span class="tag k-${s.k}">${s.k}</span></div><div class="d">${s.d}</div></button>`).join("");
}

function checkCell(pr) {
  const r = lastRun(pr);
  if (!r) return `<td colspan="${ITEMS.length}" class="ref">검사 도입 전 (문서 기반 시기)</td>`;
  return ITEMS.map(([k]) => { const it = r.result.items.find(x => x.key === k); return `<td class="${it.ok ? "ok" : "no"}" title="${esc(it.detail)}">${it.ok ? "통과" : "실패"}</td>`; }).join("");
}
function mergeBadge(pr) {
  const r = lastRun(pr);
  if (pr.state === "MERGED") return r ? `<span class="badge b-ok">검사 통과 · 병합됨</span>` : `<span class="badge b-mu">병합됨 (검사 전)</span>`;
  return r && r.result.ok ? `<span class="badge b-ok">병합 가능</span>` : `<span class="badge b-no">병합 불가</span>`;
}

function checkDetail(pr) {
  const runs = runsOf(pr);
  if (!runs.length) return `<p class="ref">#${pr.number}은 자동 검사를 도입하기 전(문서 기반)에 병합됐습니다. 기록만 가져옵니다.</p>`;
  const r = runs[0].result;
  return `<h4>#${pr.number} 최신 검사</h4>` + r.items.map(i => `<div class="ck"><div class="h"><span class="${i.ok ? "ok" : "no"}">${i.ok ? "✓" : "×"}</span>${esc(i.name)}</div><div class="c">${esc(i.detail)}</div></div>`).join("") +
    `<div class="att"><b>검사 이력 (${runs.length}회)</b>${runs.map(c => `<div><span class="${c.result.ok ? "ok" : "no"}">${c.result.ok ? "통과" : "실패"}</span><span class="mono">${esc(c.createdAt.slice(0, 16).replace("T", " "))}</span><span class="ref">${esc(c.result.items.filter(i => !i.ok).map(i => i.name).join(", ") || "모두 통과")}</span><a class="ref" href="${esc(c.url)}" target="_blank">Actions ↗</a></div>`).reverse().join("")}</div>`;
}

function shots() {
  const list = SHOTS[stage]; if (!list) return "";
  const [id, t, cap] = list[Math.min(shotSel, list.length - 1)];
  return `<div class="shots">${list.length > 1 ? `<div class="sh-tabs">${list.map((x, i) => `<button data-sh="${i}" class="${x[0] === id ? "on" : ""}">${x[1]}</button>`).join("")}</div>` : ""}
    <div class="shot"><img src="img/poc/${id}.jpg" alt="${esc(t)}"></div><p class="cap"><span class="poc">화면</span>${esc(cap)}</p><p class="cap">${POC_NOTE}</p></div>`;
}

function view() {
  const s = STAGES[stage];
  let h = `<div class="say"><b>${stage + 1}. ${s.n}</b>${esc(s.say)}</div>`;
  const prs = D.prs;
  if (stage === 4) {
    const pr = prs.find(p => p.number === prSel) || prs[0];
    h += shots() + `<div class="sub">시연 저장소 자동 검사 결과 (GitHub Actions 실제 실행)</div><div class="two"><div class="pad"><table><tr><th>PR</th>${ITEMS.map(i => `<th>${i[1]}</th>`).join("")}<th>병합</th></tr>${prs.map(p => `<tr class="click${p.number === pr.number ? " sel" : ""}" data-pr="${p.number}"><td><b>#${p.number}</b> ${esc(p.title)}</td>${checkCell(p)}<td>${mergeBadge(p)}</td></tr>`).join("")}</table>
      <div class="note">검사 기준은 docs/확인필요항목_기준.md, 검사 파일은 .github/workflows/governance-check.yml 입니다. 결과는 사이트 DB에 저장돼 GitHub에 접속하지 않아도 이력을 봅니다.</div></div><div class="pad">${checkDetail(pr)}</div></div>`;
  } else if (SHOTS[stage]) {
    h += shots();
  } else {
    h += `<div class="pad"><p class="ref">이 단계는 사이트 화면이 없습니다.</p></div>`;
  }
  $("main").innerHTML = h;
}

function render() { stages(); view(); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-i],[data-pr],[data-sh]"); if (!b) return;
  if (b.dataset.i) { stage = +b.dataset.i; shotSel = 0; }
  else if (b.dataset.sh) shotSel = +b.dataset.sh;
  else if (b.dataset.pr) prSel = +b.dataset.pr;
  render();
});
function load(d) { D = d; $("meta").textContent = `PR ${d.prs.length}건 · 검사 ${d.checks.length}회 · 사이트 DB 저장 ${d.synced_at}`; render(); }
$("sync").onclick = async () => {
  $("sync").textContent = "가져오는 중…";
  const r = await fetch("/api/sync", {method: "POST"}); const d = await r.json();
  $("sync").textContent = "GitHub에서 다시 가져오기";
  if (d.error) return alert("가져오지 못했습니다 (저장된 데이터 그대로 사용): " + d.error);
  load(d);
};
// 서버 없이 열면(정적 호스팅) 저장본으로 동작
fetch("/api/site").then(r => { if (!r.ok) throw 0; return r.json(); })
  .catch(() => { $("sync").hidden = true; return fetch("../scenario/snapshot/site.json").then(r => r.json()); })
  .then(load);
</script>
</body></html>
