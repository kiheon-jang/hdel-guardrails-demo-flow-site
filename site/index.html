.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line)}.top b{font-size:16px}
.demo{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:3px}.meta{color:var(--muted);font-size:13px}
.tabs{margin-left:auto;display:flex;gap:4px}.tabs a{padding:4px 12px;font-size:13px;border:1px solid var(--line);color:var(--muted);text-decoration:none}.tabs .on{background:var(--rec);border-color:var(--rec);color:#fff}
.stages{display:grid;grid-template-columns:repeat(6,1fr);background:var(--paper);border-bottom:1px solid var(--line)}
.st{padding:10px 14px;border-right:1px solid var(--line);font-size:13px}.st:last-child{border-right:0}.st .n{font-weight:700}.st .n i{font-style:normal;color:var(--muted);margin-right:6px}.st .d{color:var(--muted);font-size:12px}
.st .f{margin-top:3px;font-size:11.5px;color:var(--rec)}.st:hover{background:var(--soft)}.st.on{background:var(--recs);box-shadow:inset 0 -3px 0 var(--rec)}
.body{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0;background:var(--paper)}
.tree{border-right:1px solid var(--line);padding:10px 0;font-family:var(--mono);font-size:12.5px;overflow:auto}
.tree button{display:flex;align-items:center;gap:6px;width:100%;padding:3px 14px;white-space:nowrap}.tree button:hover{background:var(--soft)}
.tree .dir{color:var(--muted)}.tree .sel{background:var(--devs)!important}.tree .dim{color:#aab1b9}.tree .dim .tg{opacity:.5}.tree .hl{font-weight:700}
.tree .virt{font-family:var(--sans);color:var(--rec);margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
.tg{font-family:var(--sans);font-size:10.5px;padding:0 5px;border-radius:2px;margin-left:auto}.t-rule{background:var(--syss);color:var(--sys)}.t-out{background:var(--recs);color:var(--rec)}.t-opt{background:var(--soft);color:var(--muted)}
.det{padding:18px 24px;overflow:auto}.det h3{margin:0 0 2px;font-size:18px}.path{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin:12px 0}.facts div{padding:8px 12px;border-right:1px solid var(--line)}.facts div:last-child{border-right:0}.facts small{display:block;color:var(--muted);font-size:11.5px}
.stinfo{border:1px solid var(--line);background:var(--recs);padding:10px 14px;margin-bottom:12px}.stinfo b{display:block}
h4{font-size:13.5px;margin:16px 0 6px}
.chg{font-size:12.5px}.chg div{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}.chg code{font-family:var(--mono);color:var(--muted);min-width:56px}.chg .ai{font-size:11px;color:var(--dev)}
pre{font-family:var(--mono);font-size:12px;background:var(--soft);border:1px solid var(--line);padding:10px 12px;white-space:pre-wrap;margin:0;max-height:420px;overflow:auto}
.sec{border:1px solid var(--line);margin-top:8px}.sec .h{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--soft);font-weight:600;font-size:13px}.sec .c{padding:6px 10px;font-size:13px}.sec .c p{margin:2px 0}
.who{font-size:11px;padding:1px 6px;border-radius:2px;font-weight:600;margin-left:auto}.w-ai{background:var(--devs);color:var(--dev)}.w-me{background:var(--revs);color:var(--rev)}
.prl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.prl button{border:1px solid var(--line);padding:3px 10px;font-size:12.5px}.prl .on{border-color:var(--rec);background:var(--recs)}
.em{background:var(--revs);color:var(--rev);font-size:11px;padding:1px 6px;margin-left:6px}
.sw{display:flex;gap:4px;margin:8px 0}.sw button{border:1px solid var(--line);padding:2px 10px;font-size:12px}.sw .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{color:var(--muted);font-style:normal}
.sec table{border-collapse:collapse;width:100%;font-size:12.5px}.sec td,.sec th{border:1px solid var(--line);padding:3px 8px;text-align:left}.sec th{background:var(--soft);font-weight:600}
</style></head><body>
<div class="top"><b>점검관리 툴</b><span class="demo">시연용 test 프로젝트</span><span class="meta" id="meta"></span>
 <div class="tabs"><a class="on" href="./">① 문서 기반 보기</a><a href="site.html">② 사이트 기반 관리</a><a href="tour.html">▶ 발표 모드</a></div></div>
<div class="stages" id="stages"></div>
<div class="body"><div class="tree" id="tree"></div><div class="det" id="det"></div></div>
<script>
// ── 정의: 규칙 · 결과 문서 (README "문서 경로"와 같음) ─────────
const PR_BODY = "@PR";  // 저장소 밖 (GitHub PR)
const DOCS = {
  "docs/AI_코딩_사용지침.md": {name: "사용 지침 문서", kind: "rule", when: "착수 · 첫 커밋", who: "개발 리더 + 정보보호 담당", how: "저장소에 파일로 (플러그인의 rules/ 복사)", use: "개발자가 읽음 · 입력 금지 정보 · 병합 절차"},
  "AGENTS.md": {name: "AI 규칙 문서 (공통)", kind: "rule", when: "착수 · 첫 커밋", who: "개발 리더 / 담당 개발자", how: "저장소 최상위 (도구가 정한 위치)", use: "AI가 매 작업 시작 때 읽음 · 여러 AI 도구 공통"},
  "GEMINI.md": {name: "AI 규칙 문서 (Gemini CLI)", kind: "rule", when: "착수 · 첫 커밋", who: "개발 리더(양식) · 담당 개발자(배치)", how: "저장소 최상위 · @./AGENTS.md 를 불러옴", use: "Gemini CLI가 읽음"},
  "CLAUDE.md": {name: "AI 규칙 문서 (Claude Code)", kind: "rule", when: "착수 · 첫 커밋", who: "개발 리더(양식) · 담당 개발자(배치)", how: "저장소 최상위 · @AGENTS.md 를 불러옴", use: "Claude Code가 읽음"},
  ".claude/settings.json": {name: "프로젝트 설정 (플러그인 사용 선언)", kind: "rule", when: "착수 · 첫 커밋", who: "개발 리더(양식) · 담당 개발자(배치)", how: ".claude/ (도구가 정한 위치)", use: "hdel-ai-coding 플러그인을 켜 팀원이 처음 열면 설치 안내 · .env · 키 파일 읽기 차단. 명령 5개 · 이해 확인 검사는 플러그인 안에 있음"},
  ".github/pull_request_template.md": {name: "PR 템플릿 문서", kind: "rule", when: "착수 · 첫 커밋", who: "개발 리더(양식) · 담당 개발자(배치)", how: "플랫폼이 정한 위치", use: "AI가 PR 본문을 이 형식으로 채움 · 칸마다 작성 주체 표시"},
  "docs/HISTORY.md": {name: "히스토리 문서", kind: "out", when: "PR 만들 때 · 같은 브랜치", who: "AI 작성 · 개발자 확인", how: "제목 아래(최신이 위)에 추가 → 병합 시 코드와 함께 main", use: "변경 이유 추적 · 인수인계 근거"},
  "docs/HANDOVER.md": {name: "인수인계 문서", kind: "out", when: "PR 만들 때 · 같은 브랜치", who: "AI 작성 · 개발자 확인", how: "/hdel-ai-coding:병합요청 이 PR마다 바뀐 부분만 고침 → 병합 시 코드와 함께 main", use: "담당 교체 · 처음 보는 사람 안내 · /hdel-ai-coding:인수인계 로 보기"},
  "docs/결정기록/": {name: "결정 기록 문서 (선택)", kind: "opt", when: "구조를 바꾸는 PR에서 · 원할 때만", who: "AI 초안 · 개발자 확인", how: "docs/결정기록/NNNN-제목.md 로 PR에 포함", use: "인수인계의 \"주요 결정\" 근거"},
  [PR_BODY]: {name: "PR 본문", kind: "out", when: "PR 만들 때", who: "AI 초안 · 이해 확인만 개발자 직접 (대화에서 한 문항씩)", how: "GitHub PR 본문 + 병합 커밋 메시지 (git 에도 남음)", use: "병합 판단 · 히스토리로 옮겨 적음"},
};
const STAGES = [
  {n: "착수", d: "규칙 문서 배치", f: "규칙 문서 8개", files: Object.keys(DOCS).filter(p => DOCS[p].kind === "rule").concat(["docs/HISTORY.md", "docs/HANDOVER.md"]),
   say: "담당 개발자가 적용 명령으로 rules/ 를 경로 그대로 저장소에 넣습니다(첫 커밋). 규칙은 저장소에 있어 팀 모두가 받습니다. HISTORY · HANDOVER는 빈 양식으로 함께 들어갑니다."},
  {n: "개발", d: "AI가 규칙대로", f: "AGENTS.md 읽음", files: ["AGENTS.md", "CLAUDE.md", "docs/AI_코딩_사용지침.md"],
   say: "새 문서는 없습니다. AI가 CLAUDE.md → AGENTS.md 를 읽고 규칙대로 작업합니다."},
  {n: "커밋 · 테스트", d: "커밋에 AI 표시", f: "Co-Authored-By", files: ["lib/", "test/"],
   say: "브랜치에서 커밋하고 dart test 를 돌립니다. AI가 만든 커밋에는 Co-Authored-By 가 자동으로 붙습니다 (파일 아님, 커밋 메시지)."},
  {n: "병합 요청", d: "PR 본문 + 히스토리 + 인수인계", f: "PR 본문 · HISTORY · HANDOVER", files: [".github/pull_request_template.md", ".claude/settings.json", "docs/HISTORY.md", "docs/HANDOVER.md", "docs/결정기록/", PR_BODY],
   say: "/hdel-ai-coding:병합요청 으로 AI가 PR 본문 · HISTORY 항목 · HANDOVER 갱신을 함께 씁니다. 개발자는 대화에서 이해 확인에 한 문항씩 답하고, 최종 확인 후 PR 생성 · 병합까지 Claude 안에서 끝납니다."},
  {n: "병합", d: "코드와 기록이 함께", f: "main", files: ["docs/HISTORY.md", "docs/결정기록/", "lib/", "test/"],
   say: "PR로 병합하면 코드와 HISTORY · HANDOVER · 결정 기록이 같은 커밋으로 main에 들어가고, PR 본문은 그 커밋 메시지로 남습니다."},
  {n: "기록 · 인계", d: "PR마다 · /hdel-ai-coding:인수인계", f: "HANDOVER.md", files: ["docs/HISTORY.md", "docs/HANDOVER.md"],
   say: "인수인계 문서는 /hdel-ai-coding:병합요청 이 PR마다 바뀐 부분만 고쳐 항상 최신입니다. 내용은 /hdel-ai-coding:인수인계 로 요약해 봅니다."},
];

let D, sel = null, stage = 3, prSel = null, bodyView = "final";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"}[c]));
const inStage = p => STAGES[stage].files.some(f => f === p || (f.endsWith("/") && p.startsWith(f)));
const docKey = p => DOCS[p] ? p : p.startsWith("docs/결정기록/") ? "docs/결정기록/" : null;

function stages() {
  $("stages").innerHTML = STAGES.map((s, i) => `<button class="st${i === stage ? " on" : ""}" data-i="${i}"><div class="n"><i>${i + 1}</i>${s.n}</div><div class="d">${s.d}</div><div class="f">${s.f}</div></button>`).join("");
}

function tree() {
  const paths = Object.keys(D.files).sort((a, b) => a.split("/").length - b.split("/").length || a.localeCompare(b));
  const root = {};
  for (const p of paths) { let n = root; const parts = p.split("/"); parts.forEach((x, i) => { n = n[x] = n[x] || (i === parts.length - 1 ? null : {}); if (n === null) return; }); }
  const ord = o => Object.keys(o).sort((a, b) => (o[a] === null) - (o[b] === null) || a.localeCompare(b));
  const rows = [];
  const walk = (o, pre, depth) => ord(o).forEach(k => {
    const p = pre + k;
    if (o[k] === null) {
      const dk = docKey(p), t = dk && DOCS[dk].kind;
      const tag = t ? `<span class="tg t-${t}">${{rule: "규칙", out: "결과", opt: "선택"}[t]}</span>` : "";
      rows.push(`<button data-p="${esc(p)}" class="${sel === p ? "sel" : ""} ${inStage(p) ? "hl" : "dim"}" style="padding-left:${14 + depth * 14}px">${esc(k)}${tag}</button>`);
    } else {
      const open = !["lib", "test", "assets"].includes(k) || inStage(p + "/");
      rows.push(`<button class="dir ${inStage(p + "/") ? "hl" : ""}" data-d="${esc(p)}" style="padding-left:${14 + depth * 14}px">${open ? "▼" : "▶"} ${esc(k)}/</button>`);
      if (open || (window.OPEN || {})[p]) walk(o[k], p + "/", depth + 1);
    }
  });
  walk(root, "", 1);
  $("tree").innerHTML = `<button class="dir">▼ 점검관리 툴/</button>` + rows.join("") +
    `<button class="virt ${sel === PR_BODY ? "sel" : ""} ${inStage(PR_BODY) ? "hl" : "dim"}" data-p="${PR_BODY}">＋ PR 본문 (GitHub, 저장소 밖)<span class="tg t-out">결과</span></button>`;
}

// 파일을 바꾼 커밋(PR) 목록
const changes = p => D.commits.filter(c => c.files.some(f => f.path === p || (p.endsWith("/") && f.path.startsWith(p)))).reverse();
// PR 본문 칸 나누기: 제목 · 작성 주체(첫 주석) · 내용
function sections(body) {
  return body.split(/\n(?=#{2,3} )/).slice(1).map(s => {
    const lines = s.split("\n"), h = lines[0].replace(/^#+\s*/, "");
    const cm = lines.find(l => l.startsWith("<!--")) || "";
    return {h, who: cm.includes("직접 작성") ? "me" : cm.includes("AI 초안") ? "ai" : "", c: lines.slice(1).filter(l => !l.startsWith("<!--")).join("\n").trim()};
  });
}
// 파일별 AI 기여: 그 파일을 마지막으로 다룬 PR 본문에서
function aiOf(p) {
  for (const pr of [...D.prs].reverse()) { const m = pr.body_final.match(new RegExp("\\| " + p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + " \\| ([^|]+) \\|")); if (m) return [pr.n, m[1].trim()]; }
  return null;
}

// PR 본문 칸 내용: 표 · 체크박스 · 줄
function md(t) {
  const out = []; let tb = [];
  const flush = () => { if (!tb.length) return; const r = tb.filter(l => !/^\|[-| ]+\|$/.test(l)).map(l => l.slice(1, -1).split("|").map(x => esc(x.trim())));
    out.push(`<table><tr>${r[0].map(x => `<th>${x}</th>`).join("")}</tr>${r.slice(1).map(x => `<tr>${x.map(y => `<td>${y}</td>`).join("")}</tr>`).join("")}</table>`); tb = []; };
  for (const l of t.split("\n")) { if (l.startsWith("|")) { tb.push(l.trim()); continue; } flush(); if (l.trim()) out.push(`<p>${esc(l).replace(/^- \[x\]/, "✓").replace(/^- \[ \]/, "□")}</p>`); }
  flush(); return out.join("");
}
// 커밋 작성자: PR 병합 커밋은 PR 담당(개발자A · B)으로 표시
const authorOf = c => { const m = c.subject.match(/\(#(\d+)\)$/); const pr = m && D.prs.find(x => x.n === +m[1]); return pr ? pr.author : c.author; };

function prBody() {
  const pr = D.prs.find(x => x.n === prSel) || D.prs[D.prs.length - 2];
  prSel = pr.n;
  const secs = sections(bodyView === "ai" ? pr.body_ai : pr.body_final);
  return `<div class="prl">${D.prs.map(x => `<button data-pr="${x.n}" class="${x.n === pr.n ? "on" : ""}">#${x.n} ${esc(x.title.replace("[긴급] ", ""))}${x.emergency ? '<span class="em">긴급</span>' : ""}</button>`).join("")}</div>
    <div class="sw"><button data-v="ai" class="${bodyView === "ai" ? "on" : ""}">AI가 올린 본문</button><button data-v="final" class="${bodyView === "final" ? "on" : ""}">개발자 확인 후 (최종)</button></div>
    ${pr.understand_after_merge ? '<p class="meta">긴급: 먼저 병합하고 이해 확인은 병합 뒤 보완했습니다.</p>' : ""}
    ${secs.map(s => `<div class="sec"><div class="h">${esc(s.h)}${s.who ? `<span class="who w-${s.who}">${s.who === "me" ? "직접 작성" : "AI 초안"}</span>` : ""}</div>${s.c ? `<div class="c">${md(s.c)}</div>` : `<div class="c empty">비어 있음</div>`}</div>`).join("")}`;
}

function detail() {
  const s = STAGES[stage];
  let h = `<div class="stinfo"><b>${stage + 1}. ${s.n}</b>${esc(s.say)}</div>`;
  if (!sel) { $("det").innerHTML = h + `<p class="meta">왼쪽 트리에서 파일을 고르세요. 굵게 보이는 파일이 이 단계에서 만들거나 쓰는 문서입니다.</p>`; return; }
  const dk = docKey(sel), m = dk && DOCS[dk];
  h += `<h3>${esc(m ? m.name : sel.split("/").pop())}</h3><div class="path">${sel === PR_BODY ? "GitHub PR 본문 · 저장소 파일 아님" : esc(sel)}</div>`;
  if (m) h += `<div class="facts"><div><small>언제</small>${m.when}</div><div><small>누가</small>${m.who}</div><div><small>어떻게 저장</small>${esc(m.how)}</div><div><small>어디에 쓰이나</small>${m.use}</div></div>`;
  if (sel === PR_BODY) { $("det").innerHTML = h + prBody(); return; }
  const ai = !m && aiOf(sel);
  if (ai) h += `<p class="meta">AI 기여: <b>${esc(ai[1])}</b> (PR #${ai[0]} 본문의 파일별 AI 기여)</p>`;
  const ch = changes(sel);
  h += `<h4>이 파일이 바뀐 커밋</h4><div class="chg">${ch.map(c => `<div><code>${c.sha}</code><span>${esc(c.subject)}</span><span class="meta">${esc(authorOf(c))}</span>${c.ai ? '<span class="ai">AI 표시</span>' : ""}</div>`).join("") || '<div class="meta">없음</div>'}</div>`;
  h += `<h4>현재 내용 (v0.1.0)</h4><pre>${esc(D.files[sel] ?? "")}</pre>`;
  $("det").innerHTML = h;
}

function render() { stages(); tree(); detail(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.i) { stage = +b.dataset.i; sel = STAGES[stage].files.find(f => D.files[f] || f === PR_BODY) || null; }
  else if (b.dataset.p) sel = b.dataset.p;
  else if (b.dataset.d) { window.OPEN = window.OPEN || {}; window.OPEN[b.dataset.d] = !window.OPEN[b.dataset.d]; }
  else if (b.dataset.pr) prSel = +b.dataset.pr;
  else if (b.dataset.v) bodyView = b.dataset.v;
  else return;
  render();
});
