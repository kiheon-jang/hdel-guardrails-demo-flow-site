<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hdel ai-coding plugin 쉬운 시연</title>
<!--
  hdel ai-coding plugin 쉬운 시연 (0.9.1 기준). 빌드 없이 이 파일이 원본입니다.
  장면을 열면 줄이 모두 옅게 보이고, 자동 재생이 "지금" 줄을 하나씩 옮깁니다. 끝나면 모든 줄이 또렷하게 남습니다.
  주소 뒤: #3 = 장면 3 재생, #3.9 = 장면 3 의 9번 줄에서 멈춤(줄 수를 넘으면 끝 상태), #print = 일곱 장면의 끝 상태를 세로로.
  장면 1 은 [플러그인 없이] · [플러그인과 함께] 두 가지 줄 묶음이 있습니다. 칸 머리(나 · AI · 플러그인 · 팀 저장소)를 누르면 그 칸이 하는 일이 나옵니다.
  키: ← → 장면 · ↑ ↓ 줄 · 스페이스 멈춤 / 이어 재생 · R 이 장면 다시.
  버튼 결과 문구의 근거: plugin/commands/*.md, plugin/flows/upload.md · overview.md · analyze.md · start-new.md (아래 BTN 표).
-->
<style>
:root{--paper:#fff;--ink:#17202a;--text:#2a3440;--muted:#5b6672;--line:#d8dde3;--soft:#f4f6f8;--navy:#17202a;--cream:#faf8f3;
--me:#f0b429;--mes:#fff4d4;--ai:#d97757;--ais:#fdf1ec;--pl:#2c6e49;--pls:#e2f0e7;--repo:#3b4a5a;--repos:#e6e9ee;
--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
/* 16:9 한 장: 가로 · 세로 중 작은 쪽 기준. 1em = 화면 폭의 1% (1600px 폭에서 16px) */
.stage{width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
.sl{font-size:min(1vw,1.7778vh);width:100%;height:100%;display:flex;flex-direction:column;background:var(--soft);line-height:1.45}
body.print{display:block;overflow:auto;height:auto}
body.print .stage{width:100vw;height:56.25vw;margin-bottom:1vw}
body.print .sl{font-size:1vw}
body.print .nav,body.print .rp,body.print .keys,body.print .ccs,body.print .ccp{visibility:hidden}

/* 위 띠 (남색): 이름 · 장면 제목 · 전체 진행 n / 8 · 키 안내 · 다시 재생 */
.hd{position:relative;display:flex;align-items:center;gap:1em;padding:.7em 1.4em .9em;background:var(--navy);color:#fff}
.hd b{font-size:1.5em;white-space:nowrap}
.hd b span{color:#7fd1a1}
.hd small{font-size:.95em;color:#9fb0c0;white-space:nowrap}
.hd .ver{font-family:var(--mono);font-size:.85em;color:#9fb0c0}
.hd .st{font-size:1.2em;font-weight:700;margin-left:.6em;white-space:nowrap}
.meta{margin-left:auto;display:flex;align-items:center;gap:.8em;font-size:.85em;color:#9fb0c0;white-space:nowrap}
.meta .cnt{font:600 1.15em var(--mono);color:#fff}
.meta .rp{border:1px solid #3a4754;border-radius:.4em;padding:.15em .7em;color:#cfd8e1}
.meta .rp:hover{background:#243140}
.prog{position:absolute;left:1.4em;right:1.4em;bottom:.35em;height:.3em;background:#2c3845;border-radius:.2em;overflow:hidden}
.prog i{display:block;height:100%;background:#2fbf71;transition:width .4s}
/* 장면 탭 (이전 시연 문서의 단계 탭 모양) */
.top{display:flex;align-items:center;gap:.8em;padding:.4em .9em;background:var(--paper);border-bottom:1px solid var(--line)}
.stages{display:flex;gap:.3em;flex:1}
.stages button{flex:1;border:1px solid var(--line);padding:.3em .5em;font-size:.95em;color:var(--muted);text-align:center;white-space:nowrap;border-radius:.25em}
.stages button:hover{border-color:var(--pl)}
.stages button.on{border-color:var(--pl);background:var(--pls);color:var(--pl);font-weight:700}

.body{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:.8em;padding:.6em .8em .6em;min-height:0}
.pane{background:#fff;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* 왼쪽: 누가 누구에게 */
.who{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line);margin-left:2.4em}
.who div{padding:.35em .4em .3em;text-align:center;font-weight:700;font-size:1.2em;border-bottom:.3em solid;transition:opacity .35s}
.who small{display:block;font-weight:500;font-size:.7em;line-height:1.2;color:var(--muted)}
.who .me{border-color:var(--me)}.who .ai{border-color:var(--ai)}.who .pl{border-color:var(--pl)}.who .repo{border-color:var(--repo)}
.who div.off{opacity:.18}
.who div{cursor:pointer}.who div:hover small{color:var(--ink)}
.row[hidden]{display:none}
.mt{display:flex;gap:.3em;padding:.4em .6em;border-bottom:1px solid var(--line)}
.mt button{border:1px solid var(--line);border-radius:.25em;padding:.25em .9em;font-size:1em;color:var(--muted);white-space:nowrap}
.mt button:hover{border-color:var(--pl)}
.mt button.on{border-color:var(--pl);background:var(--pls);color:var(--pl);font-weight:700}
.chat{display:flex;flex-direction:column;gap:.5em}
.aim{align-self:flex-start;background:var(--ais);border:1px solid var(--ai);border-radius:.8em;padding:.3em .9em;max-width:90%}
.aim small{display:block;font-size:.72em;font-weight:700;color:var(--muted)}
.msg i{font-family:var(--sans)}
.lane{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:.2em 0 .2em 2.4em;min-height:0;
 background:linear-gradient(90deg,transparent calc(25% - 1px),var(--line) 25%,transparent calc(25% + 1px),transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px),transparent calc(75% - 1px),var(--line) 75%,transparent calc(75% + 1px)) 2.4em 0/calc(100% - 2.4em) 100% no-repeat}
.row{position:relative;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;min-height:2.5em;cursor:pointer;transition:opacity .3s}
.row .no{position:absolute;left:-2em;top:50%;transform:translateY(-50%);width:1.5em;height:1.5em;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 .85em/1.4em var(--mono);text-align:center;color:var(--muted)}
.lane.dim .row{opacity:.38}
.lane.dim .row.now,.row.now{opacity:1}
.row.now .no{background:var(--navy);border-color:var(--navy);color:#fff}
.msg{grid-row:1;margin:0 .6em;border-radius:.6em;padding:.25em .75em;font-size:1.25em;line-height:1.28;border:1.5px solid}
.msg i{font-style:normal;display:block;font-size:.82em;color:var(--text)}
.msg.me{background:var(--mes);border-color:var(--me)}
.msg.ai{background:var(--ais);border-color:var(--ai)}
.msg.pl{background:var(--pls);border-color:var(--pl)}
.msg.repo{background:var(--repos);border-color:var(--repo)}
.msg small{display:block;font-size:.72em;font-weight:700;color:var(--muted)}
.row.now .msg{--c:var(--repo);box-shadow:0 0 0 1.5px var(--c),0 2px 8px rgba(23,32,42,.14)}
.row.now .msg.me{--c:var(--me)}.row.now .msg.ai{--c:var(--ai)}.row.now .msg.pl{--c:var(--pl)}
/* 명령 입력 줄: 입력창 모양 */
.msg.cmd{background:#fff;font:700 .95em var(--mono);font-size:1.12em;padding-top:.4em;padding-bottom:.4em}
.msg.cmd .pr{color:var(--ai);margin-right:.35em}
/* 묻는 줄: 질문 + 버튼 칩 */
.ql{display:flex;flex-wrap:wrap;align-items:center;gap:.25em .3em;margin-top:.25em}
.ql:first-child{margin-top:0}
.ql>span{font-weight:700;margin-right:.2em}
.bt{display:inline-block;font-size:.84em;line-height:1.3;border:1.5px solid #d9d4c7;background:#fff;border-radius:.4em;padding:.12em .5em;white-space:nowrap;color:var(--ink)}
.bt:hover{border-color:var(--ai)}
.bt.hit{border:2px solid var(--ai);background:var(--ais);font-weight:700;padding:calc(.12em - .5px) calc(.5em - .5px)}
.bt.na{opacity:.45;cursor:default;border-style:dashed}
.bt.na:hover{border-color:#d9d4c7}
/* 화살표: 말풍선에서 받는 쪽 칸 가운데까지 */
.arr{grid-row:1;position:relative;align-self:stretch;color:#9aa4b0}
.row.now .arr{color:var(--muted)}
.arr i{position:absolute;top:50%;height:2px;margin-top:-1px;background:currentColor}
.arr.r i{left:-.6em;right:calc(100% / var(--k) / 2)}
.arr.l i{right:-.6em;left:calc(100% / var(--k) / 2)}
.arr.try i{background:repeating-linear-gradient(90deg,currentColor 0 .5em,transparent .5em .8em)}
.arr i::after{content:"";position:absolute;top:50%;transform:translateY(-50%);border:.5em solid transparent}
.arr.r i::after{right:-.6em;border-left-color:currentColor;border-right-width:0;border-left-width:.7em}
.arr.l i::after{left:-.6em;border-right-color:currentColor;border-left-width:0;border-right-width:.7em}

/* 오른쪽 위: 이때 내 화면 */
.rh{padding:.5em 1em;border-bottom:1px solid var(--line);font-weight:700;font-size:1.05em;display:flex;gap:.6em;align-items:center}
.rh i{width:.9em;height:.9em;border-radius:.2em;background:var(--ai);display:inline-block}
.rh em{margin-left:auto;font-style:normal;font-weight:500;color:var(--muted);font-size:.9em}
.scr{flex:1;background:var(--cream);padding:.9em 1em;display:flex;flex-direction:column;gap:.6em;font-size:1.2em;line-height:1.4;overflow:hidden;min-height:0}
.bub{align-self:flex-end;background:#ece7db;border-radius:.8em;padding:.3em .9em}
.bub.c{font-family:var(--mono);font-weight:700;font-size:.92em}
.card{border:1.5px solid #d9d4c7;background:#fff;border-radius:.7em;padding:.55em .75em}
.card>b{display:block;margin-bottom:.3em}
.card .q{font-weight:700;margin-top:.45em}
.card .q:first-child{margin-top:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.3em}
.opts.one{grid-template-columns:1fr}
.opt{display:block;width:100%;text-align:left;border:1px solid #e6e2d8;border-radius:.5em;padding:.2em .6em;background:#fff}
.opt:hover{border-color:var(--ai)}
.opt small,.plain small{display:block;font-size:.76em;color:var(--muted);font-weight:500}
.opt.hit{border:2px solid var(--ai);background:var(--ais);font-weight:700}
.opt.na{opacity:.45;cursor:default;border-style:dashed}
.opt.na:hover{border-color:#e6e2d8}
.type{border:2px solid var(--me);background:var(--mes);border-radius:.5em;padding:.25em .7em;margin-top:.3em;min-height:2em}
.type small{display:block;font-size:.76em;font-weight:700;color:#9a5b00}
.ck{display:grid;gap:.35em}
.ck div{background:#fff;border:1px solid var(--line);border-radius:.5em;padding:.3em .8em}
.ck div::before{content:"✓ ";color:var(--pl);font-weight:700}
.miss{display:grid;gap:.35em}
.miss div{border:1.5px dashed var(--line);border-radius:.5em;padding:.3em .8em;color:var(--muted);display:flex;justify-content:space-between;gap:1em}
.miss div span{font-weight:700}
.ok{background:var(--pls);border-radius:.6em;padding:.5em .9em;color:#1d4a31;font-weight:700}
.stop{background:var(--pls);border-left:.35em solid var(--pl);border-radius:.5em;padding:.5em .9em;color:#1d4a31}
.stop b{display:block}
.plain{background:#fff;border:1px solid var(--line);border-radius:.5em;padding:.4em .8em}
.mut{color:var(--muted);font-size:.85em}
.rec{display:grid;gap:.35em}
.rec>div{background:#fff;border:1px solid var(--line);border-left:.35em solid var(--repo);border-radius:.4em;padding:.35em .8em}
.rec>div>span{font-weight:700}
.rec small{display:block;color:var(--muted);font-size:.8em}
.rec ul{margin:.1em 0 0;padding-left:1.1em;font-size:.85em}
.rec li.new{font-weight:700}
.cmdbox{background:#fff;border:1.5px solid #d9d4c7;border-radius:.5em;padding:.5em .8em;font:700 .76em/1.7 var(--mono);white-space:nowrap}
/* 오른쪽 아래: 이 버튼을 누르면 */
.res{border-top:1px solid var(--line);background:#fff;padding:.6em 1em .75em;min-height:7.2em}
.res .lb{display:flex;align-items:center;gap:.5em;font-size:.95em;font-weight:700;color:var(--muted);margin-bottom:.25em}
.res .lb .bt{font-size:.95em;cursor:default}
.res p{margin:0;font-size:1.15em;line-height:1.4}

/* 장면 8: 한 장 정리 */
.sumb{display:flex;flex-direction:column;justify-content:center;gap:2em;padding:1.4em 3em;background:#fff;margin:.8em .8em .7em;border:1px solid var(--line);border-radius:6px;flex:1}
.sumb [data-s]{transition:opacity .3s;cursor:pointer}
.sumb.dim [data-s]{opacity:.3}
.sumb.dim [data-s].now,.sumb [data-s].now{opacity:1}
.flow{display:flex;align-items:center;gap:1em;font-size:1.65em}
.flow .st2{border:1.5px solid var(--line);border-radius:.6em;padding:.5em .9em;text-align:center;background:var(--soft)}
.flow .st2 b{display:block}
.flow .st2 small,.flow .grp>small{display:block;color:var(--muted);font-size:.78em}
.flow code,.need code{font:700 .85em var(--mono)}
.flow .to{color:var(--muted);font-weight:700}
.flow .grp{border:2px solid var(--pl);border-radius:.7em;padding:.4em .8em .6em;background:var(--pls)}
.flow .grp>div{display:flex;align-items:center;gap:.7em;margin-top:.3em}
.flow .grp .st2{background:#fff}
.need{font-size:1.5em;color:var(--text);margin-top:1em}
.need span{display:inline-block;border:1.5px solid var(--line);border-radius:.5em;padding:.15em .6em;margin-left:.4em}
.three{display:grid;gap:.9em}
.three div{font-size:2em;font-weight:700;padding:.35em .8em;border-left:.35em solid;border-radius:.3em}
.three .pl{border-color:var(--pl);background:var(--pls)}
.three .me{border-color:var(--me);background:var(--mes)}
.three .repo{border-color:var(--repo);background:var(--repos)}

/* 아래: 자막 띠 (이전 시연 문서의 .cc · .ccp · .ccs · .ccb) */
.cc{position:relative;display:flex;align-items:center;gap:.9em;background:var(--navy);color:#fff;padding:.8em 1em .7em;margin:0 .8em .8em;border-radius:6px;min-height:4.8em;overflow:hidden}
.ccp{position:absolute;left:0;right:0;top:0;height:.25em;background:#2c3845}
.ccp i{display:block;height:100%;width:0;background:#f0b429}
.cc.done .ccp i{background:#2fbf71}
.ccs{flex:none;font-size:.85em;font-weight:700;padding:.2em .65em;border-radius:1em;background:#3a3214;color:#f0c060;white-space:nowrap}
.cc.done .ccs{background:#163a26;color:#7fe0a8}
.ccb{flex:1;display:flex;align-items:center;gap:.7em;min-width:0}
.ccb .cn{font-family:var(--mono);font-size:.95em;color:#7fd1a1;white-space:nowrap}
.ccb b{font-size:.95em;font-weight:700;background:var(--pl);padding:.12em .55em;border-radius:.25em;white-space:nowrap}
.ccb b.u{background:var(--me);color:#000}
.ccb b.k{background:var(--ai)}
.ccb b.r{background:var(--repo)}
.ccb .t{flex:1;font-size:1.5em;font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ccb .t code{font:700 .9em var(--mono);color:#f0c060}
/* 이전 · 다음 (이전 시연 문서의 .nav 단추) */
.nav{display:flex;gap:.6em;flex:none}
.nav button{height:2.8em;border-radius:.55em;font-size:1.05em;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.35em;padding:0 1.1em;white-space:nowrap;transition:transform .1s,background .2s}
.nav .prev{border:2px solid #3f4d5b;color:#dfe6ec}
.nav .prev:hover{background:#243140}
.nav .next{background:#2fbf71;color:#08140d;min-width:9em}
.nav .next:hover{background:#43d685}
.nav button:active{transform:scale(.97)}
.nav button:disabled{opacity:.3;cursor:default}
.nav .next.fin:disabled{opacity:1}
.nav .next.busy{background:#1d2a24;color:#7fa58e;border:2px solid #2f5a42;font-size:.95em}
.nav .next.busy::before{content:"재생 중 ·";font-size:.85em;font-weight:600}
.nav .next.ready{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .4em rgba(47,191,113,.25)}}
</style>
</head>
<body>
<script>
const WHO={me:["나","u"],ai:["AI","k"],pl:["플러그인",""],repo:["팀 저장소","r"]},COL={me:1,ai:2,pl:3,repo:4},ALL=["me","ai","pl","repo"];

/* 버튼: 이름과 "누르면 어떻게 되나". 문구는 플러그인 파일의 선택지 설명에서 가져왔다(비개발 부서 쉬운 말 치환: plugin/flows/ask.md).
   r 이 null 이면 파일에 결과가 적혀 있지 않아 누를 수 없는 모양(옅게)으로 둔다. */
const BTN={
 // plugin/commands/시작하기.md 3
 "s.new":["새 프로젝트","이력이 거의 없는 프로젝트입니다. 규칙 문서만 넣고 시작합니다."],
 "s.run":["이미 운영 중","기존 이력으로 변경 기록 · 인수인계 초안까지 만듭니다. 이어서 인수인계를 얼마나 자세히 만들지 묻습니다."],
 "s.dev":["개발 부서","올릴 때 이해 확인을 3문항(동작 · 우려 · 고른 이유) 받습니다."],
 "s.non":["비개발 부서","올릴 때 이해 확인을 1문항(어떻게 확인했나) 받습니다. 화면 기준으로, 쉬운 말로 묻습니다."],
 "s.cc":["Claude Code만","이름 그대로: Claude Code 만 씁니다."],
 "s.gem":["Gemini CLI도 사용","GEMINI.md 를 함께 넣습니다."],
 // plugin/flows/start-new.md 5
 "s.ok":["반영 (추천)","규칙 문서를 따로 반영해 첫 작업의 반영 요청(PR)에 섞이지 않게 합니다."],
 "s.fix":["고칠 곳 있음",null],
 "s.no":["저장(커밋)하지 않음","넣은 파일은 저장(커밋)하지 않은 채 남아 있습니다. 고칠 곳을 말하거나, 직접 저장(커밋)해도 됩니다."],
 // plugin/flows/upload.md 3 · 4
 "a.rel":["이 질문 관련 설명","변경 설명에서 이 질문과 관련된 부분만 보여 주고, 이 질문만 다시 묻습니다. 횟수 제한은 없습니다."],
 "a.all":["전체 설명","변경 설명을 다시 보여 주고, 이 질문만 다시 묻습니다."],
 "a.type":["직접 입력","내 말로 쓴 답을 고치지 않고 그대로 반영 요청(PR) 본문에 넣습니다. 너무 짧거나 설명을 그대로 옮긴 답이면 다시 묻습니다."],
 // plugin/flows/upload.md 5 · 6

 {f:"pl",to:"me",k:"w",m:ql("무엇을 할까요?",["m.up","m.urg","m.look","m.an"]),b:"m.urg",c:"급하면 [긴급 올리기]. 먼저 반영하고 이해 확인은 바로 뒤에 받습니다.",h:"플러그인이 물음",s:MENU},
 {f:"pl",to:"repo",m:"긴급: 먼저 반영<i>이해 확인은 바로 뒤에</i>",c:"긴급 올리기는 먼저 반영하고, 이해 확인은 바로 뒤에 받습니다.",d:"지금 답하지 않으면 다음 올리기 때 다시 묻습니다.",h:"긴급 올리기",s:`<div class="ok">반영 요청(PR)이 먼저 반영됐습니다.</div><div class="card"><b>${Q1}</b><div class="type"><small>직접 입력 ← 반영 뒤에 씁니다</small></div></div>`}]},

 {f:"ai",to:"pl",dash:1,m:"바로 올리려 함<i>팀 저장소로</i>",c:"AI 가 올리기를 거치지 않고 팀 저장소로 바로 올리려 합니다.",d:"AI 가 기준 버전(main)에 바로 올리는 명령을 실행하려 합니다.",h:"기다리는 중",s:`<div class="plain">AI 가 기준 버전(main)에 바로 올리려 합니다.</div>`},
 {f:"pl",to:"ai",m:"막습니다<i>올리기로만 반영</i>",c:"플러그인이 막습니다. 반영은 올리기로만 합니다.",d:"명령이 실행되기 전에 막고, 올리기로 하라고 알립니다.",h:"플러그인이 막음",s:`<div class="stop"><b>막았습니다</b>기준 버전(main)에 바로 반영하지 않습니다. 작업 공간(브랜치)에서 /ai-coding:올리기 로 진행해 주세요.</div>`},
 {f:"me",to:"repo",m:"웹에서 직접 넣은 변경",c:"사람이 웹에서 직접 넣은 변경은 플러그인이 막지 못합니다.",d:"플러그인은 AI 코딩 도구(예: Claude Code) 안에서 동작합니다. 웹 화면은 그 밖입니다.",h:"웹 화면",s:`<div class="plain">웹 화면에서 바로 반영했습니다.</div>`},
 {f:"me",to:"pl",k:"cmd",m:CMD("/ai-coding:올리기"),c:"다음에 누군가 올리기를 하면",d:"올리기는 시작할 때 올리기 없이 들어간 변경이 있는지 확인합니다.",h:"다음 올리기",s:C("/ai-coding:올리기")},
 {f:"pl",to:"repo",m:"찾아서 인수인계에 [높음]",c:"플러그인이 찾아서 인수인계 문서에 [높음]으로 적습니다.",d:"막지는 않고, 찾은 것을 알리고 관리 포인트에 남깁니다.",h:"팀 저장소에 남은 것",s:`<div class="rec"><div><span>인수인계 문서 · 관리 포인트</span><small>[높음] 올리기 없이 반영: a1b2c3d 안내 글 수정 (작성자, 날짜)</small></div></div><div class="mut">서버 쪽 검사는 이 플러그인의 범위가 아닙니다.</div>`}]},
{t:"한 장 정리",n:"정리",sum:true,ew:"repo",e:"기록은 플러그인이, 이해 확인은 내가. 팀 저장소에는 변경과 기록이 함께 남습니다.",rows:[
 {f:"me",c:"흐름은 이것뿐입니다. 설치, 시작하기, 그리고 작업마다 올리기."},
 {f:"pl",c:"기록은 플러그인이 씁니다."},

 {f:"repo",c:"팀 저장소에는 변경과 기록이 함께 남습니다."}]}];

const SUM=`<div class="sumb">
 <div data-s="0"><div class="flow">
  <div class="st2"><b>설치</b><small>PC 마다 한 번</small></div><span class="to">→</span>
  <div class="st2"><b><code>/ai-coding:시작하기</code></b><small>프로젝트마다 한 번</small></div><span class="to">→</span>
  <div class="grp"><small>작업마다</small><div><div class="st2"><b>AI 에게 요청</b><small>말로 시킵니다</small></div><span class="to">→</span><div class="st2"><b><code>/ai-coding:올리기</code></b><small>이해 확인 · 반영</small></div></div></div>
 </div>
 <div class="need">필요할 때<span><code>/ai-coding:파악하기</code></span><span><code>/ai-coding:분석하기</code></span><span><code>/ai-coding:메뉴</code></span></div>
 <div class="need" style="margin-top:.6em;font-size:1.25em;color:var(--muted)">Claude Code 를 예로 들었습니다. Gemini CLI 에도 같은 방식으로 적용합니다.</div></div>
 <div class="three"><div class="pl" data-s="1">기록은 플러그인이 씁니다.</div><div class="me" data-s="2">이해 확인은 내가 직접 답합니다.</div><div class="repo" data-s="3">팀 저장소에는 변경과 기록이 함께 남습니다.</div></div>
</div>`;

const hasB=r=>/data-b=/.test(r.m||"");
const DUR=r=>hasB(r)?3500:2500;
const groupOf=k=>({"s.new":"sp","s.run":"sp","s.dev":"so","s.non":"so","s.cc":"st","s.gem":"st","s.ok":"sk","s.fix":"sk","s.no":"sk"}[k]||k.split(".")[0]);

function build(si){
 const sc=S[si],st=document.createElement("div");st.className="stage";
 let body;
 if(sc.sum) body=SUM;
 else{
  const rows=sc.rows.map((r,i)=>{const a=COL[r.f];let cls=`msg ${r.f}${r.k==="cmd"?" cmd":""}`,h;
   if(!r.to) h=`<div class="${cls}" style="grid-column:${a}">${r.m}</div>`;
   else{const b=COL[r.to],wide=r.k&&Math.abs(b-a)>1,dash=r.dash?" try":"";
    if(b>a){const e=wide?b-1:a;h=`<div class="${cls}" style="grid-column:${a}/${e+1}">${r.m}</div><div class="arr r${dash}" style="grid-column:${e+1}/${b+1};--k:${b-e}"><i></i></div>`}
    else{const e=wide?b+1:a;h=`<div class="arr l${dash}" style="grid-column:${b}/${e};--k:${e-b}"><i></i></div><div class="${cls}" style="grid-column:${e}/${a+1}">${r.m}</div>`}}
   const no=sc.rows.slice(0,i+1).filter(x=>x.mode===r.mode).length;
   return `<div class="row" data-i="${i}"><span class="no">${no}</span>${h}</div>`}).join("");
  body=`<div class="body"><div class="pane">${sc.modes?`<div class="mt"><button data-mode="없이">플러그인 없이</button><button data-mode="함께">플러그인과 함께</button></div>`:""}<div class="who">${ALL.map(w=>`<div class="${w}" data-who="${w}">${WHO[w][0]}<small>${{me:"개발자 · 담당자",ai:"예: Claude Code",pl:"hdel ai-coding",repo:"모두가 함께 쓰는 원본"}[w]}</small></div>`).join("")}</div><div class="lane">${rows}</div></div>
  <div class="pane"><div class="rh"><i></i>이때 내 화면<em></em></div><div class="scr"></div><div class="res"><div class="lb"></div><p></p></div></div></div>`;
 }
 st.innerHTML=`<div class="sl"><div class="hd"><b><span>hdel</span> ai-coding plugin</b><small>쉬운 시연</small><span class="ver">0.9.1</span><span class="st">${si+1}. ${sc.t}</span>
  <div class="meta"><span class="cnt">${si+1} / ${S.length}</span><span class="keys">← → 장면 · ↑ ↓ 줄 · 스페이스 멈춤 · R 다시</span><button class="rp" data-act="replay">↻ 다시 재생</button></div>
  <div class="prog"><i style="width:${(si+1)/S.length*100}%"></i></div></div>
  <div class="top"><div class="stages">${S.map((x,i)=>`<button data-go="${i}"${i==si?' class="on"':""}>${i+1} ${x.n}</button>`).join("")}</div></div>
  ${body}<div class="cc"><div class="ccp"><i></i></div><span class="ccs">▶ 재생 중</span><div class="ccb"><span class="cn"></span><b></b><span class="t"></span></div>
  <span class="nav"><button class="prev" data-act="prev"${si===0?" disabled":""}>← 이전</button><button class="next" data-act="next"${si===S.length-1?" disabled":""}>다음 →</button></span></div></div>`;
 st._sel={...(sc.pick||{})};
 return st;
}

/* 그리기: now = 지금 줄(-1 이면 끝 상태), view = 오른쪽에 보일 줄, last = 마지막으로 누른 버튼 */
function paint(st,si,now,ended,last){
 const sc=S[si],q=s=>st.querySelector(s),N=sc.rows.length,fin=ended&&now<0;
 const mode=sc.modes?(now>=0?sc.rows[now].mode:(st._mode||"함께")):null,vis=sc.rows.map((x,i)=>i).filter(i=>!mode||sc.rows[i].mode===mode);
 const view=now>=0?now:vis[vis.length-1],r=sc.rows[view];
 st.querySelectorAll(".row").forEach(el=>{el.hidden=!vis.includes(+el.dataset.i)});
 st.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
 let on=ALL;if(!ended){for(let i=0;i<=view;i++)if(sc.rows[i].on)on=sc.rows[i].on;if(mode&&!r.on)on=ALL}else if(r&&r.on)on=r.on;
 st.querySelectorAll(".who div").forEach((d,i)=>d.classList.toggle("off",!on.includes(ALL[i])));
 const lane=q(".lane")||q(".sumb");lane.classList.toggle("dim",!ended);
 st.querySelectorAll(".row,[data-s]").forEach(el=>{const x=+(el.dataset.i??el.dataset.s);el.classList.toggle("now",x===now)});
 if(q(".scr")){
  q(".scr").innerHTML=r.s||"";q(".rh em").textContent=r.h||"";
  const sel=st._sel;st.querySelectorAll("[data-b]").forEach(b=>b.classList.toggle("hit",sel[groupOf(b.dataset.b)]===b.dataset.b));
  const k=last||(hasB(r)?(sel[groupOf(r.b)]||r.b):null);
  if(k&&k.startsWith("who:")){const w=ROLE[k.slice(4)];q(".res .lb").innerHTML=`이 칸이 하는 일 <span class="bt hit">${w[0]}</span>`;q(".res p").textContent=w[1]}
  else if(k){q(".res .lb").innerHTML=`이 버튼을 누르면 <span class="bt hit">${BTN[k][0]}</span>`;q(".res p").textContent=BTN[k][1]}
  else{q(".res .lb").textContent="이 줄에서 일어나는 일";q(".res p").textContent=r.d||""}
 }
 const fe=mode==="없이"?sc.me:sc.e,cap=fin?fe:r.c,w=fin?(mode==="없이"?"repo":sc.ew):r.f,b=q(".ccb b"),M=vis.length,vi=vis.indexOf(view)+1;
 q(".ccb .cn").textContent=`${fin?M:vi}/${M}`;b.textContent=WHO[w][0];b.className=WHO[w][1];
 q(".ccb .t").innerHTML=cap.replace(/(\/ai-coding:[^\s<.,]+)(?![^<]*<\/code>)/g,"<code>$1</code>");
 q(".cc").classList.toggle("done",ended);
}

let si=0,now=0,ended=false,playing=false,timer=null,cur=null,last=null;
function bar(){const sc=S[si],b=cur.querySelector(".ccp i"),ds=sc.rows.map(DUR),T=ds.reduce((a,x)=>a+x,0);
 const before=ds.slice(0,Math.max(now,0)).reduce((a,x)=>a+x,0);
 b.style.transition="none";
 if(ended){b.style.width="100%";return}
 b.style.width=(before/T*100)+"%";
 if(playing){void b.offsetWidth;b.style.transition=`width ${ds[now]}ms linear`;b.style.width=((before+ds[now])/T*100)+"%"}}
function status(){const s=cur.querySelector(".ccs"),n=cur.querySelector(".nav .next");
 s.textContent=ended?"✓ 재생 완료":playing?"▶ 재생 중":"Ⅱ 멈춤";
 n.classList.toggle("busy",playing);n.classList.toggle("ready",ended&&si<S.length-1);
 const fin=si===S.length-1;n.classList.toggle("fin",fin&&ended);if(fin)n.textContent=ended?"✓ 완료":"마지막 장면"}
function draw(){paint(cur,si,now,ended,last);bar();status()}
function tick(){clearTimeout(timer);if(!playing)return;
 timer=setTimeout(()=>{if(now<S[si].rows.length-1){now++;last=null;draw();tick()}else{playing=false;ended=true;now=-1;last=null;draw()}},DUR(S[si].rows[now]))}
function open(s,row,play){
 s=Math.max(0,Math.min(S.length-1,s));clearTimeout(timer);
 if(cur)cur.remove();cur=build(s);document.body.appendChild(cur);si=s;last=null;
 const N=S[s].rows.length;
 if(row>=N){ended=true;playing=false;now=-1}else{ended=false;now=Math.max(0,row);playing=play}
 draw();tick();
 try{history.replaceState(null,"",play?`#${s+1}`:ended?`#${s+1}.${N+1}`:`#${s+1}.${now+1}`)}catch(e){}
}
function pause(){playing=false;clearTimeout(timer);draw()}
function toggle(){if(ended){open(si,0,true);return}playing=!playing;if(playing){last=null;draw();tick()}else pause()}
function row(i){const N=S[si].rows.length;playing=false;clearTimeout(timer);last=null;
 if(i>=N){ended=true;now=-1}else now=Math.max(0,i);
 draw();try{history.replaceState(null,"",`#${si+1}.${ended&&now<0?N+1:now+1}`)}catch(e){}}
function down(){const N=S[si].rows.length;if(now<0)return;row(now+1)}
function up(){const N=S[si].rows.length;row(now<0?N-1:Math.max(0,now-1))}
function press(k,el){if(!BTN[k][1])return;
 const rw=el&&el.closest(".row");playing=false;clearTimeout(timer);
 if(rw)now=+rw.dataset.i;else if(now<0)now=S[si].rows.length-1;
 cur._sel[groupOf(k)]=k;last=k;draw()}
const next=()=>{if(si<S.length-1)open(si+1,0,true)}, prev=()=>{if(si>0)open(si-1,0,true)};

if(location.hash==="#print"){
 document.body.classList.add("print");
 S.forEach((sc,i)=>{const st=build(i);document.body.appendChild(st);paint(st,i,-1,true,null);st.querySelector(".ccs").textContent="✓ 재생 완료";st.querySelector(".ccp i").style.width="100%"});
}else{
 document.addEventListener("click",e=>{const t=e.target.closest("button,.row,[data-s],[data-who]");if(!t||!cur)return;
  if(t.dataset.b){press(t.dataset.b,t);return}
  if(t.dataset.mode){playing=false;clearTimeout(timer);cur._mode=t.dataset.mode;ended=true;now=-1;last=null;draw();return}
  if(t.dataset.who){playing=false;clearTimeout(timer);last="who:"+t.dataset.who;draw();return}
  if(t.dataset.go!==undefined){open(+t.dataset.go,0,true);return}
  const a=t.dataset.act;if(a==="next")next();else if(a==="prev")prev();else if(a==="replay")open(si,0,true);
  else if(t.classList.contains("row"))row(+t.dataset.i);else if(t.dataset.s!==undefined)row(+t.dataset.s)});
 document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;if(k==="ArrowRight"){e.preventDefault();next()}else if(k==="ArrowLeft"){e.preventDefault();prev()}
  else if(k==="ArrowDown"){e.preventDefault();down()}else if(k==="ArrowUp"){e.preventDefault();up()}
  else if(k===" "){e.preventDefault();toggle()}else if(k==="r"||k==="R")open(si,0,true)});
 const fromHash=()=>{const m=/^#(\d+)(?:\.(\d+))?$/.exec(location.hash);if(m)open(+m[1]-1,m[2]?+m[2]-1:0,!m[2]);else open(0,0,true)};
 window.addEventListener("hashchange",fromHash);
 fromHash();
}
window.__easy={S,BTN,next,prev,open,toggle,down,up,press,row,state:()=>({scene:si+1,row:now+1,ended,playing,last,sel:cur&&{...cur._sel}})};
</script>
